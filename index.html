/* ---------------- Execution (idempotent, debit → credit, rollback on failure) ---------------- */
async function execToken(q0) {
  if (!q0 || OP.busy) return;
  OP.busy = true; closeSheet(); busy(true, t('processing'), 15);
  let rec = null;
  try {
    const snap = await db.ref('config/token').once('value');   /* always use the freshest admin rate */
    S.cfg.token = snap.val();
    const q = quote(q0.type, q0.src, q0.dst, q0.amt);
    if (!q.ok) { busy(false); toast(q.err || t('tk_unavail')); renderAll(); return; }
    const slip = num(((TKC() || {}).market || {}).slippagePct) || 1;
    if (q.feePct !== q0.feePct || q.gasCur !== q0.gasCur || Math.abs(q.rate - q0.rate) / Math.max(q0.rate, 1e-12) * 100 > slip) { busy(false); toast(t('rate_changed')); renderSub(false); return; }
    if ((TKC() || {}).secureExec === true) {   /* trusted path: a Cloud Function prices + executes the order atomically */
      busy(true, t('processing'), 45);
      const r = await execSecure(q);
      if (!r || !r.ok) { busy(false); toast(r && r.error ? r.error : t('fail_generic')); renderAll(); return; }
      const sn = await db.ref('tokenTransactions/' + r.txId).once('value'); const srec = sn.val();
      if (srec) { OP.amt = ''; await finalizeTok(srec, 'completed', ''); showTokResult(srec); }
      return;
    }
    const txId = 'TKN' + Date.now() + rid();
    rec = { txId, userId: uid, userName: tgUser.first_name || 'User', type: q.type, source: q.src, destination: q.dst, amountIn: q.amt, amountOut: q.out, fee: q.fee, feeUnit: q.dst, feePct: q.feePct, gasFee: q.gas || 0, gasCur: q.gasCur || 0, executionPrice: q.rate, rate: q.rate, tokenQuantity: q.tokenQty, cashValue: q.cashValue, tokenSymbol: tsym(), marketPrice: tprice() || null, status: 'processing', timestamp: Date.now() };
    busy(true, t('processing'), 35);
    const cr = await db.ref('tokenTransactions/' + txId).transaction(c => c ? undefined : rec);   /* idempotency guard */
    if (!cr.committed) { busy(false); toast(t('dup_tx')); return; }
    busy(true, t('processing'), 60);
    const debited = await adjUser(FIELD[q.src], -q.amt);
    if (!debited) { await finalizeTok(rec, 'failed', t('err_bal')); showTokResult(rec); return; }
    busy(true, t('processing'), 80);
    const credited = await adjUser(FIELD[q.dst], q.out);
    if (!credited) { await adjUser(FIELD[q.src], q.amt); await finalizeTok(rec, 'failed', t('err_credit')); showTokResult(rec); return; }
    await finalizeTok(rec, 'completed', '');
    OP.amt = ''; showTokResult(rec);
  } catch (e) {
    console.error(e);
    if (rec && rec.status === 'processing') { try { await finalizeTok(rec, 'failed', 'error'); } catch (e2) {} }
    toast(t('fail_generic'));
  } finally { OP.busy = false; busy(false); }
}
function execSecure(q) {
  const oid = 'ORD' + Date.now() + rid(), ref = db.ref('tokenOrders/' + uid + '/' + oid);
  return new Promise(async resolve => {
    let done = false; const fin = v => { if (done) return; done = true; try { ref.child('result').off(); } catch (e) {} resolve(v); };
    setTimeout(() => fin({ ok: false, error: L2('Server did not respond. Please try again.', 'সার্ভার সাড়া দেয়নি। আবার চেষ্টা করুন।') }), 25000);
    ref.child('result').on('value', s => { if (s.exists()) fin(s.val()); });
    try { await ref.set({ type: q.type, src: q.src, dst: q.dst, amt: q.amt, quotedPrice: q.rate, ts: firebase.database.ServerValue.TIMESTAMP }); } catch (e) { fin({ ok: false, error: t('fail_generic') }); }
  });
}
async function finalizeTok(rec, status, reason) {
  rec.status = status; rec.completedAt = Date.now(); if (reason) rec.failReason = reason;
  const upd = { status, completedAt: rec.completedAt }; if (reason) upd.failReason = reason;
  try { await db.ref('tokenTransactions/' + rec.txId).update(upd); } catch (e) {}
  try { await db.ref('tokenHistory/' + uid + '/' + rec.txId).set(rec); } catch (e) {}
  try { const r = await db.ref('tokenTransactions/' + rec.txId + '/statsApplied').transaction(c => c ? undefined : true); if (r.committed) await applyStats(rec); } catch (e) {}
  const un = a => a === 'token' ? rec.tokenSymbol : sym();
  if (status === 'completed') notify('token', t('tk_notif_ok', t('tk_' + rec.type)), fmt(rec.amountIn, DP(rec.source)) + ' ' + un(rec.source) + ' → ' + fmt(rec.amountOut, DP(rec.destination)) + ' ' + un(rec.destination) + '\n' + t('tx_id') + ': ' + rec.txId, 'tok_' + rec.txId);
  else notify('token', t('tk_notif_fail', t('tk_' + rec.type)), (rec.failReason || '') + '\n' + t('tx_id') + ': ' + rec.txId, 'tok_' + rec.txId);
}
/* Analytics counters for the Admin panel: total tx, unique users, quantity, value, success/failed. */
async function applyStats(rec) {
  const base = 'tokenStats/' + rec.type, ok = rec.status === 'completed';
  await db.ref(base).transaction(s => {
    s = s || {};
    s.count = (s.count || 0) + 1;
    if (ok) {
      s.completedCount = (s.completedCount || 0) + 1;
      s.totalTokens = rnd((s.totalTokens || 0) + num(rec.tokenQuantity), 6);
      s.totalValue = rnd((s.totalValue || 0) + num(rec.cashValue), 4);
      s.totalFees = rnd((s.totalFees || 0) + num(rec.fee), 6);
      if (rec.type === 'transfer') { if (rec.destination === 'main') s.toMainTokens = rnd((s.toMainTokens || 0) + num(rec.tokenQuantity), 6); else s.toTaskTokens = rnd((s.toTaskTokens || 0) + num(rec.tokenQuantity), 6); }
    } else s.failedCount = (s.failedCount || 0) + 1;
    s.updatedAt = Date.now(); return s;
  });
  if (ok) {
    const r = await db.ref('tokenUsers/' + rec.type + '/' + rec.userId).transaction(c => c ? undefined : { firstAt: Date.now() });
    if (r.committed) await db.ref(base + '/uniqueUsers').transaction(n => (n || 0) + 1);
  }
}
function showTokResult(rec) {

/* ---------- Live watchers: deposit / withdrawal status changes ---------- */
const W = { dep: {}, wd: {} };
function syncWatchers() {
  const u = S.user; try { twdWatch(); } catch (e) {}
  const sync = (store, hist, root, handler) => {
    Object.entries(hist || {}).forEach(([k, i]) => {
      if (!i) return;
      const id = i.depId || i.wdId || k, pend = ['pending', 'processing'].includes(i.status || 'pending');
      if (pend && !store[id]) {
        const ref = db.ref(root + '/' + id);
        const cb = ref.on('value', s => { if (s.exists()) handler(id, s.val()); });
        store[id] = { ref, cb };
      } else if (!pend && store[id]) { store[id].ref.off('value', store[id].cb); delete store[id]; }
    });
  };
  sync(W.dep, u.depositHistory, 'depositRequests', (id, gd) => {
    if (!gd.status || gd.status === 'pending') return;
    const upd = { status: gd.status }; if (gd.adminNote) upd.adminNote = gd.adminNote;
    db.ref('users/' + uid + '/depositHistory/' + id).update(upd); db.ref('deposits/' + id).update(upd);
    const ok = gd.status === 'approved';
    toast(ok ? t('dep_ok_toast') : t('dep_bad_toast'));
    if (gd.status === 'approved' || gd.status === 'rejected') NT.send(uid, ok ? 'dep_approved' : 'dep_rejected', 'dep_' + id + '_' + gd.status, { id, amount: gd.amount, method: gd.method, txn: gd.txId || gd.transactionId, reason: gd.adminNote });
  });
  sync(W.wd, u.withdrawHistory, 'withdrawals', (id, gd) => {
    if (!gd.status || gd.status === 'pending') return;
    const cur = (u.withdrawHistory[id] || {}).status; if (cur !== gd.status) db.ref('users/' + uid + '/withdrawHistory/' + id).update({ status: gd.status });
    if (gd.status === 'processing') { NT.send(uid, 'wd_processing', 'wd_' + id + '_processing', { id, amount: gd.amount, net: gd.finalAmount, method: gd.method }); return; }
    if (gd.status === 'approved' || gd.status === 'rejected') showWdStatus(gd.status, gd, id);
  });
}
function showWdStatus(status, d, id) {
  const ok = status === 'approved', s = sym(), amt = d.finalAmount !== undefined ? d.finalAmount : d.amount;
  openSheet('<div class="res"><div class="big ' + (ok ? 'ok' : 'bad') + '"><i class="fas fa-' + (ok ? 'check' : 'xmark') + '"></i></div><h3>' + (ok ? t('wd_ok_title') : t('wd_bad_title')) + '</h3></div><div class="qbox">' + kv(t('method'), esc(d.method || '—')) + kv(t('amount'), esc(amt) + ' ' + s) + kv(t('status'), stLabel(status)) + '</div><div class="note ' + (ok ? '' : 'bad') + '"><span>' + (ok ? t('wd_ok_msg') : t('wd_bad_msg')) + '</span></div><button class="btn ghost" data-act="closeSheet">' + t('got_it') + '</button>');
  NT.send(uid, ok ? 'wd_approved' : 'wd_rejected', 'wd_' + id + '_' + status, { id, amount: d.amount, net: d.finalAmount, method: d.method, account: d.account, reason: d.adminNote || d.reason, payRef: d.payRef || d.paymentRef });
}

ACT.doActiveTask = async d => {
  const id = d.id; if (_tb[id]) return;
  const snap = await db.ref('activeTasks/' + id).once('value'); if (!snap.exists()) return toast(t('not_found'));
  const x = snap.val();
  if (x.status !== 'active') return toast(t('task_inactive'));
  if (String(x.creatorId) === uid) return toast(t('task_own'));
  if (x.participants && x.participants[uid]) return toast(t('task_already'));
  if (num(x.participantsCompleted) >= num(x.participantLimit)) return toast(t('slots_full'));
  _tb[id] = true;
  try {
    openLink(x.link); await sleep(4000);
    const r = await db.ref('activeTasks/' + id).transaction(c => {     /* atomic slot reservation */
      if (!c) return c;

      toast('+' + reward + ' ' + sym() + ' ' + t('task_done')); NT.send(uid, 'task_done', 'taskdone_a' + id, { id, title: x.title || x.name || x.type || '', type: x.type || '' }); NT.send(uid, 'task_reward', 'taskrw_a' + id, { id, title: x.title || x.name || x.type || '', reward });

let _evBusy = false;
ACT.evJoin = async d => {
  const e = S.events[d.id]; if (!e || _evBusy) return; if (!featOn('events')) return toast(t('feat_off'));
  if (evState(e) !== 'live') return toast(L2('Event is not open', 'ইভেন্ট খোলা নেই'));
  if (num(S.user.referrals) < num(e.minReferrals) || num(S.user.balance) < num(e.minBalance)) return toast(L2('Requirements not met', 'শর্ত পূরণ হয়নি'));
  _evBusy = true; busy(true, t('processing'), 40); const mx = num(e.maxParticipants); let counted = false;
  try {
    const r = await db.ref('events/' + e.id + '/participantCount').transaction(c => (mx > 0 && num(c) >= mx) ? undefined : num(c) + 1); if (!r.committed) { busy(false); return toast(L2('Event is full', 'সিট পূর্ণ')); } counted = true;
    const pr = await db.ref('eventParticipants/' + e.id + '/' + uid).transaction(c => c ? undefined : { uid, name: tgUser.first_name || 'User', photo: tgUser.photo_url || '', joinedAt: Date.now(), status: 'joined' });
    if (!pr.committed) { await db.ref('events/' + e.id + '/participantCount').transaction(c => Math.max(0, num(c) - 1)); busy(false); return toast(L2('Already joined', 'আগেই যোগ দিয়েছেন')); }
    if (e.rewardMode === 'instant' && num(e.reward) > 0) {
      const tok = e.rewardUnit === 'token', amt = rnd(e.reward, tok ? 4 : 2); let ok;
      if (tok) { ok = await adjUser('tokenBalance', amt); if (ok) await logLedger({ cat: 'reward', source: 'event', amount: amt, unit: 'token', ref: e.id }); } else ok = await earn(amt, 'event', e.id, 'reward');
      if (ok) { await db.ref('eventParticipants/' + e.id + '/' + uid).update({ status: 'rewarded', reward: amt, rewardedAt: Date.now() }); NT.send(uid, 'event_reward', 'evr_' + e.id, { id: e.id, title: e.title || '', reward: amt, unit: tok ? 'token' : 'main', tsym: tsym() }); }
    } else NT.send(uid, 'event_joined', 'evj_' + e.id, { id: e.id, title: e.title || '' });
    busy(false); toast(L2('You joined the event', 'ইভেন্টে যোগ দিয়েছেন'));
  } catch (err) { console.error(err); if (counted) { try { await db.ref('events/' + e.id + '/participantCount').transaction(c => Math.max(0, num(c) - 1)); } catch (x) {} } busy(false); toast(t('fail_generic')); }
  finally { _evBusy = false; busy(false); }
};

    const lockRes = (u, mc, t, lk) => { const w = [['miningHistory/' + u.id + '/' + lk.id, lk]]; return { ok: false, code: 'LOCKED', persist: true, writes: w.concat([notif(String(u.id), 'mlock_' + lk.id, 'Mining locked', 'No claim for ' + mc.lock.hours + 'h. Pay the unlock fee to resume.', t)]) }; };

    const api = {
      derive, miningCfg, rewardOf,
      async mState(uid) { const [mc, u] = [miningCfg(await cfgOf('mining')), (await db.ref('users/' + uid + '/mining').once('value')).val()]; return derive(u, mc, now()); },

      start(uid) { return cfgOf('mining').then(raw => { const mc = miningCfg(raw), t = now(); return run(uid, u => {
        if (!ready(mc)) return fail('MINING_OFF'); const m = getM(u); u.id = u.id || uid;
        const lk = lazyLock(u, mc, t); if (lk) return lockRes(u, mc, t, lk); if (m.lock) return fail('LOCKED');
        if (m.session && m.session.status === 'active') return fail('NOT_CLAIMED');
        const lvl = mc.level(m.level); if (!lvl || num(lvl.speed) <= 0) return fail('LEVEL_NOT_SET');
        const s = { id: 'S' + t + rid(), startAt: t, endAt: t + mc.sessionHours * H, speed: num(lvl.speed), level: m.level, status: 'active' };
        if (m.boost && num(m.boost.until) > t) s.boostSegs = [{ mult: num(m.boost.mult), from: t, to: Math.min(num(m.boost.until), s.endAt) }];
        m.session = s; m.sessions = num(m.sessions) + 1; if (m.boost && num(m.boost.until) <= t) m.boost = null;
        return { ok: true, persist: true, session: s, writes: [['miningHistory/' + uid + '/start_' + s.id, { id: 'start_' + s.id, type: 'start', sessionId: s.id, level: s.level, speed: s.speed, ts: t, endAt: s.endAt }]] };
      }); }); },

      claim(uid) { return cfgOf('mining').then(raw => { const mc = miningCfg(raw), t = now(); return run(uid, u => {
        if (!ready(mc)) return fail('MINING_OFF'); const m = getM(u); u.id = u.id || uid;
        const lk = lazyLock(u, mc, t); if (lk) return lockRes(u, mc, t, lk); if (m.lock) return fail('LOCKED');
        const s = m.session; if (!s || s.status !== 'active') return fail('NOT_ACTIVE');
        if (t < num(s.endAt)) return fail('EARLY_CLAIM', { remainingMs: num(s.endAt) - t });
        const r = rewardOf(s); if (!(r.total > 0)) return fail('ZERO_REWARD');
        u.tokenBalance = rnd(num(u.tokenBalance) + r.total); m.total = rnd(num(m.total) + r.total);
        s.status = 'claimed'; s.reward = r.total; s.claimedAt = t; m.lastClaimAt = t;
        return { ok: true, persist: true, reward: r.total, base: r.base, boost: r.boost, writes: [
          ['miningHistory/' + uid + '/claim_' + s.id, { id: 'claim_' + s.id, type: 'claim', sessionId: s.id, level: s.level, speed: s.speed, base: r.base, boost: r.boost, amount: r.total, ts: t }],
          ledger(uid, 'MC_' + s.id, r.total, 'token', 'mining', t, 'Mining reward')] };
      }); }); },

      upgrade(uid, toLevel) { return cfgOf('mining').then(raw => { const mc = miningCfg(raw), t = now(); return run(uid, u => {
        if (!ready(mc)) return fail('MINING_OFF'); const m = getM(u); u.id = u.id || uid; toLevel = Math.floor(num(toLevel));
        if (m.level >= mc.maxLevel) return fail('MAX_LEVEL');
        if (toLevel !== m.level + 1) return fail('ALREADY_UPGRADED');
        const lv = mc.level(toLevel); if (!lv || lv.enabled === false || num(lv.speed) <= 0) return fail('LEVEL_UNAVAILABLE');
        const freeOk = mc.free && !m.freeUsed; let cost = freeOk ? 0 : rnd(num(lv.cost));
        if (!freeOk && !(cost > 0)) return fail('LEVEL_COST_NOT_SET');
        if (cost > 0 && num(u.tokenBalance) + 1e-9 < cost) return fail('INSUFFICIENT', { need: cost, have: num(u.tokenBalance) });
        const from = m.level; if (cost > 0) u.tokenBalance = rnd(num(u.tokenBalance) - cost); if (freeOk) m.freeUsed = true; m.level = toLevel;
        const id = 'up_' + t + '_' + from + '_' + toLevel;
        return { ok: true, persist: true, from, to: toLevel, cost, free: freeOk, balance: num(u.tokenBalance), writes: [['miningUpgrades/' + uid + '/' + id, { id, from, to: toLevel, cost, free: freeOk, ts: t }]].concat(cost > 0 ? [[ 'ledger/' + uid + '/MU_' + id, { id: 'MU_' + id, cat: 'spend', source: 'mining_upgrade', amount: -cost, unit: 'token', ref: '', status: 'completed', note: 'Mining level ' + from + ' → ' + toLevel, timestamp: t }]] : []) };
      }); }); },

      unlock(uid) { return cfgOf('mining').then(raw => { const mc = miningCfg(raw), t = now(); return run(uid, u => {
        if (!ready(mc)) return fail('MINING_OFF'); const m = getM(u); u.id = u.id || uid; lazyLock(u, mc, t);
        if (!m.lock) return fail('NOT_LOCKED'); if (m.lock.by === 'admin') return fail('ADMIN_LOCKED');
        const fee = rnd(mc.lock.fee); if (fee > 0 && num(u.tokenBalance) + 1e-9 < fee) return fail('INSUFFICIENT', { need: fee, have: num(u.tokenBalance) });
        if (fee > 0) u.tokenBalance = rnd(num(u.tokenBalance) - fee);
        m.lock = null; if (m.session && m.session.status === 'active') m.session.unlockedAt = t;
        const id = 'unlock_' + t; return { ok: true, persist: true, fee, writes: [['miningHistory/' + uid + '/' + id, { id, type: 'unlock', fee, ts: t }]].concat(fee > 0 ? [['ledger/' + uid + '/MK_' + t, { id: 'MK_' + t, cat: 'spend', source: 'mining_unlock', amount: -fee, unit: 'token', ref: '', status: 'completed', note: 'Mining unlock fee', timestamp: t }]] : []) };
      }); }); },

      buyBoost(uid, packId) { return cfgOf('mining').then(raw => { const mc = miningCfg(raw), t = now(); return run(uid, u => {
        if (!ready(mc) || !mc.boost.enabled) return fail('BOOST_OFF'); const m = getM(u); u.id = u.id || uid;
        const lk = lazyLock(u, mc, t); if (lk) return lockRes(u, mc, t, lk); if (m.lock) return fail('LOCKED');
        const p = obj(mc.boost.packs[packId]); if (!p.mult || p.enabled === false) return fail('BOOST_UNAVAILABLE');
        const mult = num(p.mult), hrs = num(p.hours), cost = rnd(num(p.cost)); if (!(mult > 1) || !(hrs > 0)) return fail('BOOST_UNAVAILABLE');
        if (num(p.minLevel) > m.level || (num(p.maxLevel) > 0 && m.level > num(p.maxLevel))) return fail('BOOST_LEVEL');
        if (m.boost && num(m.boost.until) > t) return fail('BOOST_ACTIVE');
        const bb = obj(m.boostBuys); if (num(p.maxPurchases) > 0 && num(bb[packId]) >= num(p.maxPurchases)) return fail('BOOST_MAX');
        if (cost > 0 && num(u.tokenBalance) + 1e-9 < cost) return fail('INSUFFICIENT', { need: cost, have: num(u.tokenBalance) });
        if (cost > 0) u.tokenBalance = rnd(num(u.tokenBalance) - cost);
        const b = { id: 'B' + t, packId: String(packId), name: p.name || '', mult, startAt: t, until: t + hrs * H }; m.boost = b; bb[packId] = num(bb[packId]) + 1; m.boostBuys = bb;
        const s = m.session; if (s && s.status === 'active' && num(s.endAt) > t) { const segs = list(s.boostSegs); segs.push({ mult, from: t, to: Math.min(b.until, num(s.endAt)) }); s.boostSegs = segs; }
        return { ok: true, persist: true, boost: b, cost, writes: [['miningBoosts/' + uid + '/' + b.id, { id: b.id, packId: b.packId, mult, hours: hrs, cost, ts: t, until: b.until }]].concat(cost > 0 ? [['ledger/' + uid + '/MB_' + b.id, { id: 'MB_' + b.id, cat: 'spend', source: 'mining_boost', amount: -cost, unit: 'token', ref: '', status: 'completed', note: 'Mining boost', timestamp: t }]] : []) };
      }); }); },

      /* scheduler: lock overdue sessions, clear expired boosts */
      async sweep() {
        const t = now(), mc = miningCfg(await cfgOf('mining')); let locked = 0, boosts = 0; if (!mc.enabled) return { locked, boosts };
        const maxHrs = 24 * 30, cutoff = t - mc.lock.hours * H;
        const snap = await db.ref('users').orderByChild('mining/session/endAt').endAt(cutoff).once('value'); const ids = []; snap.forEach(c => { const m = (c.val() || {}).mining; if (m && m.session && m.session.status === 'active' && !m.lock) ids.push(c.key); });
        for (const uid of ids) { const r = await run(uid, u => { u.id = u.id || uid; const lk = lazyLock(u, mc, t); return lk ? lockRes(u, mc, t, lk) : fail('NOOP'); }); if (r.code === 'LOCKED') locked++; }
        const bs = await db.ref('users').orderByChild('mining/boost/until').endAt(t).once('value'); const bi = []; bs.forEach(c => bi.push(c.key));
        for (const uid of bi) { const r = await run(uid, u => { const m = u.mining; if (!m || !m.boost || num(m.boost.until) > t) return fail('NOOP'); m.boost = null; return { ok: true, persist: true }; }); if (r.ok) boosts++; }
        return { locked, boosts };
      },

      adminLock(uid, by, reason) { const t = now(); return run(uid, u => { const m = getM(u); if (m.lock) return fail('ALREADY_LOCKED'); m.lock = { at: t, reason: reason || 'admin', by: 'admin', admin: by || '' }; return { ok: true, persist: true, writes: [['miningHistory/' + uid + '/alock_' + t, { id: 'alock_' + t, type: 'lock', reason: 'admin', by: by || '', ts: t }]] }; }); },
      adminUnlock(uid, by) { const t = now(); return run(uid, u => { const m = getM(u); if (!m.lock) return fail('NOT_LOCKED'); m.lock = null; if (m.session && m.session.status === 'active') m.session.unlockedAt = t; return { ok: true, persist: true, writes: [['miningHistory/' + uid + '/aunlock_' + t, { id: 'aunlock_' + t, type: 'unlock', by: by || '', fee: 0, ts: t }]] }; }); },
      adminResetLevel(uid, by, to) { const t = now(); return run(uid, u => { const m = getM(u); const from = m.level; m.level = Math.max(1, Math.floor(num(to)) || 1); return { ok: true, persist: true, from, to: m.level, writes: [['miningUpgrades/' + uid + '/reset_' + t, { id: 'reset_' + t, from, to: m.level, cost: 0, free: false, reset: true, by: by || '', ts: t }]] }; }); },

      /* ---------- 30-day streak ---------- */
      streakClaim(uid) { return cfgOf('streak').then(raw => { const sc = streakCfg(raw), t = now(); return run(uid, u => {
        if (!sc.enabled) return fail('STREAK_OFF'); u.id = u.id || uid;
        const hr = ((t + sc.tz * 60000) % DAY) / H; if (hr < sc.from || hr >= sc.to) return fail('STREAK_WINDOW');
        const st = u.streak && typeof u.streak === 'object' ? u.streak : (u.streak = {}), v = streakView(st, sc, t);
        if (v.claimedToday) return fail('STREAK_DUP'); const day = v.next, rw = sc.day(day); if (!rw) return fail('STREAK_NOT_CONFIGURED');
        if (v.broken) { st.cur = 0; st.claims = {}; }
        let cl = obj(st.claims); if (day === 1) cl = {}; cl[day] = t; st.claims = cl; st.cur = day; st.lastDay = v.today; st.best = Math.max(num(st.best), day); st.total = num(st.total) + 1;
        credit(u, rw.type, rw.main, rw.token); let bonus = null;
        if (day === 30) { const c = sc.completion; if (c.main > 0 || c.token > 0) { credit(u, c.type, c.main, c.token); bonus = c; } st.cycles = num(st.cycles) + 1; if (!sc.repeat) st.done = true; }
        const hid = 'sk_' + v.today; const w = [['streakHistory/' + uid + '/' + hid, { id: hid, day, type: rw.type, main: rw.main, token: rw.token, bonus: bonus || null, ts: t }]];
        if ((rw.type !== 'token') && rw.main > 0) w.push(ledger(uid, 'SKM_' + v.today, rw.main + (bonus && bonus.type !== 'token' ? bonus.main : 0), 'main', 'streak', t, 'Streak day ' + day));
        if (rw.type !== 'main' && (rw.token > 0 || (bonus && bonus.token > 0))) w.push(ledger(uid, 'SKT_' + v.today, rw.token + (bonus && bonus.type !== 'main' ? bonus.token : 0), 'token', 'streak', t, 'Streak day ' + day));
        return { ok: true, persist: true, day, reward: rw, bonus, completed: day === 30, writes: w };
      }); }); },

    };
    return api;
  }
  return { createEngine, miningCfg, streakCfg, streakView, derive, rewardOf, lockDueAt, dayNum, weekNum, H, DAY };
});

<script id="mx-module">
/* NEXAVAULT — Advanced Mining & Rewards module (user panel). Appended after all existing scripts; does not edit them. */
(function () {

    ZERO_REWARD: ['Nothing to claim.', 'ক্লেইম করার মতো কিছু নেই।'], MAX_LEVEL: ['You are at the maximum level.', 'আপনি সর্বোচ্চ লেভেলে আছেন।'], ALREADY_UPGRADED: ['This upgrade was already applied. Refreshing…', 'এই আপগ্রেড আগেই হয়েছে।'],
    LEVEL_UNAVAILABLE: ['This level is not available yet.', 'এই লেভেল এখনও চালু হয়নি।'], LEVEL_NOT_SET: ['Level is not configured.', 'লেভেল কনফিগার করা নেই।'], LEVEL_COST_NOT_SET: ['Upgrade cost is not configured.', 'আপগ্রেড খরচ সেট করা নেই।'],

    BOOST_OFF: ['Boosts are unavailable.', 'বুস্ট বন্ধ আছে।'], BOOST_UNAVAILABLE: ['This boost is unavailable.', 'এই বুস্টটি পাওয়া যাচ্ছে না।'], BOOST_LEVEL: ['Your level is not eligible for this boost.', 'আপনার লেভেল এই বুস্টের জন্য প্রযোজ্য নয়।'],
    BOOST_ACTIVE: ['A boost is already active.', 'একটি বুস্ট আগে থেকেই চালু আছে।'], BOOST_MAX: ['Purchase limit reached for this boost.', 'এই বুস্টের কেনার সীমা শেষ।'],
    STREAK_OFF: ['Daily streak is unavailable.', 'ডেইলি স্ট্রিক বন্ধ আছে।'], STREAK_DUP: ['Already claimed today.', 'আজকের বোনাস নেওয়া হয়ে গেছে।'], STREAK_WINDOW: ['Outside today’s claim window.', 'আজকের ক্লেইম সময়ের বাইরে।'], STREAK_NOT_CONFIGURED: ['Reward for this day is not configured.', 'এই দিনের রিওয়ার্ড সেট করা নেই।'],
    PERM: ['The server refused this action (database rules not updated?). Ask the admin to publish the latest rules.', 'সার্ভার অনুরোধ নেয়নি (ডাটাবেস রুলস আপডেট হয়নি?)। অ্যাডমিনকে সর্বশেষ রুলস পাবলিশ করতে বলুন।'], NET: ['Network problem. Your balance was not changed — please retry.', 'নেটওয়ার্ক সমস্যা। আপনার ব্যালান্স বদলায়নি — আবার চেষ্টা করুন।'], UNSUPPORTED: ['Not supported.', 'সমর্থিত নয়।'],
    TIMEOUT: ['Server did not respond. Please try again.', 'সার্ভার সাড়া দেয়নি। আবার চেষ্টা করুন।'], AUTH: ['Telegram verification failed. Reopen the app from Telegram.', 'টেলিগ্রাম ভেরিফিকেশন ব্যর্থ। অ্যাপটি টেলিগ্রাম থেকে আবার খুলুন।'], CONFLICT: ['Busy, please try again.', 'ব্যস্ত, আবার চেষ্টা করুন।']
  };
  const em = r => { const e = ERR[r && r.code]; return e ? T2(e[0], e[1]) : T2('Something went wrong. Please try again.', 'কিছু ভুল হয়েছে। আবার চেষ্টা করুন।'); };

  /* ---------- transport: secure (Cloud Function) or local engine ---------- */
  function srv(op, params) {

      const oid = 'G' + Date.now() + rid(), ref = db.ref('gameOrders/' + uid + '/' + oid); let done = false;

  }

  INP.mxTkQ = el => { TK.q = el.value; tkPaint(); };
  ACT.mxTkF = d => { TK.f = d.id; tkPaint(); };
  ACT.mxTkTab = d => { TK.tab = d.id; if (d.id === 'mine') TK.mineL = {}; tkPaint(); };
  const findTask = id => taskList().find(x => x.id === id);
  ACT.mxTaskGo = async d => {
    const x = findTask(d.id); if (!x || TK.busy) return; if (x.lock) return toast(x.lock); if (!featOn('tasks') && x.kind === 'web') return toast(t('feat_off'));
    TK.busy = true; delete TK.fail[x.id];
    try {
      const ref = db.ref('taskStarts/' + uid + '/' + x.id);
      try { await ref.set(firebase.database.ServerValue.TIMESTAMP); } catch (e) { return toast(em({ code: 'PERM' })); }
      const v = (await ref.once('value')).val(); TK.start = Object.assign({}, TK.start || {}, { [x.id]: num(v) }); openLink(x.url); tkPaint();
    } finally { TK.busy = false; }
  };
  ACT.mxTaskVerify = async d => {
    const x = findTask(d.id); if (!x || _tb[x.id] || TK.busy) return; TK.busy = true; _tb[x.id] = true; busy(true, T2('Verifying…', 'যাচাই হচ্ছে…'), 40);
    const fail = m => { TK.fail[x.id] = m; toast(m); };
    try {
      const sv = (await db.ref('taskStarts/' + uid + '/' + x.id).once('value')).val(); const el = nowMs() - num(sv);
      if (!sv) return fail(T2('Start the task first.', 'আগে টাস্ক শুরু করুন।'));
      if (el < tsec() * 1000) { TK.start = Object.assign({}, TK.start, { [x.id]: num(sv) }); return toast(T2('Please wait for the countdown to finish.', 'কাউন্টডাউন শেষ হওয়া পর্যন্ত অপেক্ষা করুন।')); }
      if (el > 6 * 3600 * 1000) { await db.ref('taskStarts/' + uid + '/' + x.id).remove(); return fail(T2('This attempt expired. Start again.', 'এই চেষ্টার মেয়াদ শেষ। আবার শুরু করুন।')); }
      let ok = false;
      if (x.kind === 'web') {
        const w = x.raw, k = x.id; if (!taskLive(w)) return fail(t('feat_off'));
        const r = await db.ref('users/' + uid + '/taskHistory/' + k).transaction(c => c ? undefined : nowMs()); if (!r.committed) return fail(t('task_already'));
        if (num(w.completionLimit) > 0) { const cc = await db.ref('config/webTasks/' + k + '/completedCount').transaction(c => num(c) >= num(w.completionLimit) ? undefined : num(c) + 1); if (!cc.committed) { await db.ref('users/' + uid + '/taskHistory/' + k).remove(); return fail(t('task_full')); } }
        if (await earn(num(w.reward), 'task', k)) { ok = true; toast('+' + num(w.reward) + ' ' + sym() + ' ' + t('task_done')); NT.send(uid, 'task_done', 'taskdone_' + k, { id: k, title: w.title || w.name || '', type: 'Web' }); NT.send(uid, 'task_reward', 'taskrw_' + k, { id: k, title: w.title || w.name || '', reward: num(w.reward) }); }
        else { await db.ref('users/' + uid + '/taskHistory/' + k).remove(); if (num(w.completionLimit) > 0) db.ref('config/webTasks/' + k + '/completedCount').transaction(c => Math.max(0, num(c) - 1)); return fail(t('fail_generic')); }
      } else {
        const id = x.id, r = await db.ref('activeTasks/' + id).transaction(c => { if (!c) return c; if (c.status !== 'active' || String(c.creatorId) === uid) return; const dn = num(c.participantsCompleted), lim = num(c.participantLimit); if (dn >= lim || (c.participants && c.participants[uid])) return; c.participants = c.participants || {}; c.participants[uid] = { timestamp: nowMs(), name: tgUser.first_name || 'User' }; c.participantsCompleted = dn + 1; if (dn + 1 >= lim) c.status = 'completed'; return c; });
        if (!r.committed || !r.snapshot.exists()) return fail(t('slots_full'));
        const nv = r.snapshot.val(); await db.ref('userTasks/' + id).update(Object.assign({ participants: num(nv.participantsCompleted) }, nv.status === 'completed' ? { status: 'completed' } : {}));
        const reward = num(x.raw.reward);
        if (await earn(reward, 'active_task', id)) { ok = true; await db.ref('users/' + uid + '/activeTaskHistory/' + id).set({ reward, timestamp: nowMs() }); toast('+' + reward + ' ' + sym() + ' ' + t('task_done')); NT.send(uid, 'task_done', 'taskdone_a' + id, { id, title: x.raw.title || x.raw.name || x.raw.type || '', type: x.raw.type || '' }); NT.send(uid, 'task_reward', 'taskrw_a' + id, { id, title: x.raw.title || x.raw.name || x.raw.type || '', reward }); }
      }
      if (ok) { try { await db.ref('taskStarts/' + uid + '/' + x.id).remove(); } catch (e) {} flashBtn(true); }
    } catch (e) { console.error(e); fail(T2('Verification failed. Please try again.', 'ভেরিফিকেশন ব্যর্থ। আবার চেষ্টা করুন।')); flashBtn(false); }
    finally { TK.busy = false; delete _tb[x.id]; busy(false); renderAll(); }
  };
  /* legacy handlers + the single All-Pages entry all lead to the unified Tasks page */
  const goTasks = () => { S.earnTab = 'tasks'; if (S.tab === 'earn') renderEarn(); else showTab('earn'); };
  ACT.doAdminTask = goTasks; ACT.doActiveTask = goTasks;
  REG.splice(REG.findIndex(p => p.id === 'bonus'), 0, { id: 'mxtasks', cat: 'earn', ic: 'fa-list-check', en: 'Tasks', bn: 'টাস্ক', go: goTasks, nw: 1, on: () => featOn('tasks') });

  /* ================= UNIFIED BACKGROUND (home/tabs + every sub page) + LEVEL PROGRESS ================= */
  (function () {
    const mk = () => { const d = document.createElement('div'); d.className = 'mxbg'; d.setAttribute('aria-hidden', 'true'); let h = '<b></b><b></b><b></b>'; for (let i = 0; i < 14; i++) h += '<i style="left:' + (4 + i * 7) + '%;animation-delay:-' + ((i * 1.9) % 14).toFixed(1) + 's;animation-duration:' + (11 + (i * 5) % 9) + 's;--dx:' + ((i % 2 ? 1 : -1) * (14 + i * 3)) + 'px"></i>'; d.innerHTML = h; return d; };
    try { const a = $('app'); if (a && !document.querySelector('body>.mxbg')) document.body.insertBefore(mk(), a); const sb = $('sub'); if (sb && !sb.querySelector('.mxbgs')) { const w = document.createElement('div'); w.className = 'mxbgs'; w.appendChild(mk()); sb.insertBefore(w, sb.firstChild); } } catch (e) { console.warn(e); }
  })();
  try {
    const ur = SUBS.mxupgrade.render; SUBS.mxupgrade.render = function () {
      const base = ur.apply(this, arguments); try { const mc = mcfg(), s = mst(); if (!mc.enabled || !mc.configured) return base; const mx = Math.max(1, mc.maxLevel), pc = Math.min(100, s.level / mx * 100), nl = mc.level(s.level + 1);
        return '<div class="mx-lvl"><div class="row1"><div><small>' + T2('CURRENT LEVEL', 'বর্তমান লেভেল') + '</small><br><b>' + T2('Level', 'লেভেল') + ' ' + s.level + '</b></div><div style="text-align:right"><small>' + T2('NEXT', 'পরবর্তী') + '</small><br><b style="color:var(--accent)">' + (s.isMax ? 'MAX' : (T2('Level', 'লেভেল') + ' ' + (s.level + 1))) + '</b></div></div><div class="mx-bar"><i style="width:' + pc.toFixed(1) + '%"></i></div><div class="ft"><span>' + f4(s.speed) + ' ' + tk() + '/' + T2('hr', 'ঘণ্টা') + ' · ' + T2('mining power', 'মাইনিং পাওয়ার') + '</span><span>' + s.level + '/' + mx + '</span></div></div>' + base; } catch (e) { return base; }
    };
  } catch (e) { console.warn(e); }

  /* ================= GLOBAL BUTTON LOADING / DUPLICATE-CLICK GUARD ================= */
  let lastBtn = null, curBtn = null, wd = null;
  document.addEventListener('click', e => { const b = e.target.closest('.btn'); if (!b) return; if (b.classList.contains('mx-ld')) { e.stopImmediatePropagation(); e.preventDefault(); return; } lastBtn = b; setTimeout(() => { if (lastBtn === b) lastBtn = null; }, 1500); }, true);
  function endLoad(ok) { if (curBtn) { const b = curBtn; curBtn = null; b.classList.remove('mx-ld'); if (b.dataset.mxHtml != null) { b.innerHTML = b.dataset.mxHtml; delete b.dataset.mxHtml; } if (ok !== undefined) { b.classList.add(ok ? 'mx-okf' : 'mx-erf'); setTimeout(() => b.classList.remove('mx-okf', 'mx-erf'), 900); } } if (wd) { clearTimeout(wd); wd = null; } }
  window.flashBtn = ok => { MX.flash = ok; };
  const busy0 = window.busy;
  window.busy = function (show, text, pct) {
    busy0.apply(this, arguments);
    if (show) {
      if (!curBtn && lastBtn && document.contains(lastBtn)) { curBtn = lastBtn; lastBtn = null; curBtn.dataset.mxHtml = curBtn.innerHTML; curBtn.classList.add('mx-ld'); curBtn.innerHTML = '<span class="mx-spin"></span><span>' + (text || t('processing')) + '</span>'; }
      else if (curBtn && text) { const sp2 = curBtn.querySelector('span:last-child'); if (sp2) sp2.textContent = text; }
      if (!wd) wd = setTimeout(() => { wd = null; busy0(false); endLoad(false); toast(T2('This is taking longer than usual. Check your history before trying again.', 'সময় বেশি লাগছে। আবার চেষ্টার আগে ইতিহাস দেখে নিন।')); }, 45000);
    } else { const f = MX.flash; MX.flash = undefined; endLoad(f); }
  };
  try { const sr = showTokResult; window.showTokResult = function (rec) { MX.flash = !!rec && rec.status === 'completed'; return sr.apply(this, arguments); }; } catch (e) {}
  const act0 = act;  /* mining/streak actions flash success / error on their button */

  /* ================= HOME ANIMATION (opacity/transform only, plays once per visit) ================= */
  let homeNext = true;
  try { const st0 = showTab; window.showTab = function (id) { if (id === 'home') homeNext = true; return st0.apply(this, arguments); }; } catch (e) {}
  function animHome() {
    if (!homeNext) return; homeNext = false; const root = $('tab-home'); if (!root || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const kids = [...root.children].slice(0, 12); kids.forEach((c, i) => { c.classList.add('mx-rv'); c.style.animationDelay = (i * 60) + 'ms'; });
    setTimeout(() => kids.forEach(c => { c.classList.remove('mx-rv'); c.style.animationDelay = ''; }), 1300);
  }
  try { const rh = window.renderHome; window.renderHome = function () { rh.apply(this, arguments); animHome(); }; } catch (e) {}

  /* ================= WITHDRAWAL METHOD CARDS (visual layer over the existing <select id="wd-method">) ================= */
  const BR = [[/bkash/i, '#E2136E', '#B80E57', 'bKash', 'mobile'], [/nagad/i, '#F6921E', '#E2231A', 'Nagad', 'mobile'], [/rocket/i, '#8C3494', '#5B1F66', 'Rocket', 'mobile'], [/upay/i, '#FFC20E', '#F58220', 'Upay', 'mobile'], [/binance/i, '#F3BA2F', '#C99400', 'Binance', 'wallet'], [/usdt|tether|trc|bep|crypto/i, '#26A17B', '#168162', 'USDT', 'wallet'], [/paypal/i, '#0070BA', '#003087', 'PayPal', 'email'], [/payeer/i, '#00A3E0', '#0077B6', 'Payeer', 'wallet'], [/bank|dbbl|brac|city|islami/i, '#3D8BFF', '#2B5FD9', 'Bank', 'bank']];
  const brand = n => { const b = BR.find(x => x[0].test(n)); return b ? { c1: b[1], c2: b[2], lt: String(n).slice(0, 2), kind: b[4] } : { c1: '#6A5CFF', c2: '#3D8BFF', lt: String(n).slice(0, 2), kind: 'other' }; };
  function wdSync() {
    const sel = $('wd-method'); if (!sel) return; const field = sel.closest('.field'); if (!field) return;
    let host = $('mxPM'); const names = [...sel.options].filter(o => o.value).map(o => o.value), sig = names.join('|');
    if (!host) { host = document.createElement('div'); host.id = 'mxPM'; field.before(host); field.style.display = 'none'; }
    if (host.dataset.sig !== sig) { host.dataset.sig = sig; host.innerHTML = '<div class="mx-pmg">' + names.map(n => { const b = brand(n); return '<button type="button" class="mx-pm" data-act="mxPM" data-id="' + esc(n) + '" style="--c1:' + b.c1 + ';--c2:' + b.c2 + '"><span class="mx-pmi">' + esc(b.lt) + '</span><b>' + esc(n) + '</b><i class="fas fa-circle-check mx-pmc"></i></button>'; }).join('') + '</div><div class="mx-pmd" id="mxPMd"></div>'; }
    const cur = sel.value; host.querySelectorAll('.mx-pm').forEach(b => b.classList.toggle('on', b.dataset.id === cur));
    const d = $('mxPMd'); if (d) { if (cur) { const b = brand(cur), ph = { mobile: T2('Enter the ' + cur + ' mobile number', cur + ' মোবাইল নম্বর দিন'), wallet: T2('Enter your ' + cur + ' wallet / pay ID', cur + ' ওয়ালেট / পে আইডি দিন'), email: T2('Enter your ' + cur + ' email', cur + ' ইমেইল দিন'), bank: T2('Enter bank account details', 'ব্যাংক অ্যাকাউন্টের তথ্য দিন'), other: T2('Enter your ' + cur + ' account', cur + ' অ্যাকাউন্ট দিন') }[b.kind]; d.style.setProperty('--c1', b.c1); d.innerHTML = '<span class="mx-pmi" style="--c1:' + b.c1 + ';--c2:' + b.c2 + '">' + esc(b.lt) + '</span><div><b>' + esc(cur) + '</b><small>' + ph + '</small></div>'; d.classList.add('open'); } else { d.classList.remove('open'); d.innerHTML = ''; } }
  }
  ACT.mxPM = d => { const sel = $('wd-method'); if (!sel) return; sel.value = d.id; sel.dispatchEvent(new Event('change', { bubbles: true })); try { wdFeePreview(); } catch (e) {} wdSync(); const a = $('wd-account'); if (a) setTimeout(() => a.focus({ preventScroll: true }), 250); };
  try { const wr = window.wdRefresh; window.wdRefresh = function () { wr.apply(this, arguments); wdSync(); }; } catch (e) {}

  /* ---------- extend ticker: server-timestamp bars & second counters ---------- */
  setInterval(() => {
    const n = nowMs(); document.querySelectorAll('[data-mx-bar]').forEach(el => { const [a, b] = el.dataset.mxBar.split(',').map(Number); el.style.width = Math.min(100, Math.max(0, (n - a) / (b - a) * 100)).toFixed(1) + '%'; });
    document.querySelectorAll('[data-mx-sec]').forEach(el => { el.textContent = Math.max(0, Math.ceil((num(el.dataset.mxCd) - n) / 1000)); });
  }, 250);
})();
