<!DOCTYPE html>
<html lang="en" data-theme="crimson">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0D0508" id="metaTheme">
<title>NEXAVAULT</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>

<style>
/* =====================================================================
   NEXAVAULT — OBSIDIAN FUSION (orange x gold)  |  MIDNIGHT TITANIUM (blue x silver)
===================================================================== */
:root,[data-theme="obsidian"]{
  --bg:#0A0807;--bg2:#120E0B;--card:#17120E;--card2:#1F1812;--card3:#2A2017;
  --line:rgba(255,236,214,.08);--line2:rgba(255,236,214,.16);
  --text:#F6F0E8;--muted:#A89E91;--faint:#6F675D;
  --accent:#FF7A1A;--accent2:#FFA24D;--accent-soft:rgba(255,122,26,.14);
  --gold:#D9B26B;--gold2:#F2D595;--gold-soft:rgba(217,178,107,.14);
  --pos:#2BD98B;--neg:#FF5D5D;--warn:#F5B84B;--info:#5CB8FF;
  --pos-soft:rgba(43,217,139,.14);--neg-soft:rgba(255,93,93,.14);--warn-soft:rgba(245,184,75,.14);--info-soft:rgba(92,184,255,.14);
  --on-accent:#1B0D01;
  --grad-accent:linear-gradient(135deg,#FF6A00 0%,#FF9A3D 100%);
  --grad-gold:linear-gradient(135deg,#9C7428 0%,#F2D595 50%,#B98B3A 100%);
  --grad-hero:linear-gradient(145deg,#2E1D0F 0%,#1B120B 55%,#120D08 100%);
  --glow:0 12px 40px rgba(255,122,26,.25);
  --shadow:0 12px 32px rgba(0,0,0,.45);
  --bgfx1:rgba(255,122,26,.15);--bgfx2:rgba(217,178,107,.09);
}
[data-theme="titanium"]{
  --bg:#060A15;--bg2:#0A1020;--card:#0F1628;--card2:#151F37;--card3:#1D2A4A;
  --line:rgba(190,210,255,.09);--line2:rgba(190,210,255,.18);
  --text:#EEF3FF;--muted:#98A6C3;--faint:#62708F;
  --accent:#3E8BFF;--accent2:#6BB0FF;--accent-soft:rgba(62,139,255,.16);
  --gold:#C3CEE0;--gold2:#EAF0FA;--gold-soft:rgba(195,206,224,.12);
  --pos:#2BD9A0;--neg:#FF6379;--warn:#F2C04E;--info:#6BB0FF;
  --pos-soft:rgba(43,217,160,.14);--neg-soft:rgba(255,99,121,.14);--warn-soft:rgba(242,192,78,.14);--info-soft:rgba(107,176,255,.14);
  --on-accent:#fff;
  --grad-accent:linear-gradient(135deg,#2A6BFF 0%,#5FB0FF 100%);
  --grad-gold:linear-gradient(135deg,#8896AE 0%,#EAF0FA 50%,#A9B6CC 100%);
  --grad-hero:linear-gradient(145deg,#14264E 0%,#0E1A38 55%,#0A1227 100%);
  --glow:0 12px 40px rgba(62,139,255,.3);
  --shadow:0 12px 32px rgba(0,0,0,.5);
  --bgfx1:rgba(62,139,255,.17);--bgfx2:rgba(195,206,224,.07);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:'Plus Jakarta Sans','Hind Siliguri',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse 80% 45% at 0% -8%,var(--bgfx1),transparent 62%),radial-gradient(ellipse 60% 38% at 100% 0%,var(--bgfx2),transparent 62%);background-attachment:fixed}
h1,h2,h3,h4,.num{font-family:'Sora','Plus Jakarta Sans','Hind Siliguri',sans-serif}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,select,textarea{font-family:inherit;color:var(--text)}
a{color:inherit;text-decoration:none}
.theme-anim *{transition:background-color .4s,border-color .4s,color .4s,box-shadow .4s!important}
[hidden]{display:none!important}

/* ---------- Loader ---------- */
#loader{position:fixed;inset:0;z-index:99999;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity .5s,visibility .5s}
#loader.hide{opacity:0;visibility:hidden}
.ld-fx{position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,var(--bgfx1),transparent 55%),radial-gradient(circle at 80% 90%,var(--bgfx2),transparent 50%)}
.ld-fx::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(circle at 50% 42%,#000,transparent 70%);animation:gdrift 22s linear infinite}
@keyframes gdrift{to{background-position:44px 44px}}
.ld-core{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;animation:ldIn .6s cubic-bezier(.2,.8,.3,1) both}
@keyframes ldIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.ld-ring{width:132px;height:132px;position:relative;display:grid;place-items:center;margin-bottom:26px}
.ld-ring span{position:absolute;inset:0;border-radius:50%;border:2px solid transparent}
.ld-ring span:nth-child(1){border-top-color:var(--accent);border-right-color:var(--accent-soft);animation:spin 1.1s linear infinite}
.ld-ring span:nth-child(2){inset:12px;border-bottom-color:var(--gold);border-left-color:var(--gold-soft);animation:spin 1.7s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.ld-logo{width:70px;height:70px;border-radius:22px;background:var(--grad-accent);display:grid;place-items:center;font-size:1.9rem;color:var(--on-accent);box-shadow:var(--glow);animation:pulse 2s ease-in-out infinite;overflow:hidden}
.ld-logo img{width:100%;height:100%;object-fit:cover}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.ld-name{font-family:'Sora',sans-serif;font-size:1.65rem;font-weight:800;letter-spacing:3px;background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.ld-tag{font-size:.64rem;font-weight:700;letter-spacing:3.5px;color:var(--faint);text-transform:uppercase;margin-bottom:30px}
.ld-bar-wrap{width:220px;height:5px;border-radius:99px;background:var(--card2);overflow:hidden;margin-bottom:14px}
.ld-bar{height:100%;width:0;border-radius:99px;background:var(--grad-accent);box-shadow:0 0 14px var(--accent);transition:width .4s}
.ld-status{font-size:.72rem;font-weight:600;color:var(--muted);min-height:16px}

/* ---------- Overlays: ban / channel / busy ---------- */
#banScreen,#channelJoinOverlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;padding:24px;text-align:center;background:var(--bg)}
#banScreen{z-index:88888}
#channelJoinOverlay{z-index:77777}
#channelJoinOverlay.show{display:flex}
.ban-icon{width:84px;height:84px;border-radius:26px;background:var(--neg-soft);border:1.5px solid var(--neg);display:grid;place-items:center;font-size:2.2rem;color:var(--neg);margin:0 auto 18px}
#banScreen h2{font-size:1.3rem;margin-bottom:8px}
#banMsg{color:var(--muted);font-size:.86rem;line-height:1.6;max-width:300px}
.cj-card{background:var(--card);border:1px solid var(--line2);border-radius:28px;padding:26px 20px;width:100%;max-width:420px;box-shadow:var(--shadow)}
.cj-icon{width:66px;height:66px;border-radius:22px;background:var(--grad-accent);display:grid;place-items:center;font-size:1.7rem;margin:0 auto 14px;color:var(--on-accent)}
.cj-title{font-size:1.15rem;font-weight:800;margin-bottom:6px}
.cj-sub{font-size:.8rem;color:var(--muted);margin-bottom:20px;line-height:1.55}
.channel-list{display:flex;flex-direction:column;gap:9px;margin-bottom:18px;text-align:left}
.channel-item{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--card2);border-radius:16px;border:1px solid var(--line)}
.channel-item.joined{border-color:var(--pos);background:var(--pos-soft)}
.channel-num{width:34px;height:34px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:.85rem;flex-shrink:0}
.channel-name{font-size:.88rem;font-weight:700}
.channel-promo{font-size:.68rem;color:var(--pos);font-weight:600;margin-top:2px}
#busy{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.6);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center}
#busy.show{display:flex}
.busy-box{background:var(--card);border:1px solid var(--line2);border-radius:24px;padding:26px 28px;text-align:center;min-width:230px;box-shadow:var(--shadow)}
.busy-box i{font-size:1.9rem;color:var(--accent)}
.busy-box p{font-size:.88rem;font-weight:700;margin-top:12px}
.busy-bar{width:180px;height:5px;border-radius:99px;background:var(--card3);margin:12px auto 0;overflow:hidden}
.busy-bar b{display:block;height:100%;width:0;background:var(--grad-accent);transition:width .4s}

/* ---------- Layout ---------- */
.app{max-width:540px;margin:0 auto;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
.tab{display:none;animation:pageIn .3s cubic-bezier(.2,.8,.3,1)}
.tab.active{display:block}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pad{padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 12px}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.avatar{width:46px;height:46px;border-radius:15px;object-fit:cover;border:1.5px solid var(--line2);background:var(--card2);flex-shrink:0}
.who h3{font-size:.98rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who p{font-size:.7rem;color:var(--muted);font-weight:600;margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.62rem;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--pos-soft);color:var(--pos)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--neg-soft);color:var(--neg)}
.h1{font-size:1.35rem;font-weight:800}
.muted{color:var(--muted)}
.tiny{font-size:.7rem;color:var(--muted);font-weight:600}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;position:relative;flex-shrink:0;font-size:.95rem}
.iconbtn:active{transform:scale(.93)}
.dot{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:.62rem;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin:0 16px 14px;position:relative;overflow:hidden}
.card.hero{background:var(--grad-hero);border-color:var(--line2);box-shadow:var(--shadow)}
.card.flat{padding:6px 16px}
.card-t{font-size:.92rem;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:9px}
.card-t i{color:var(--accent)}
.sec{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 10px;font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:1.1px;color:var(--muted)}
.sec a,.sec button{font-size:.72rem;font-weight:700;color:var(--accent);text-transform:none;letter-spacing:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pad.grid2,.pad.grid4{padding:0 16px;margin-bottom:14px}

/* ---------- Balances ---------- */
.bal-hero{padding:20px}
.bal-hero::before{content:"";position:absolute;right:-60px;top:-60px;width:190px;height:190px;border-radius:50%;background:var(--accent-soft);filter:blur(4px)}
.bal-hero::after{content:"";position:absolute;left:-40px;bottom:-70px;width:170px;height:170px;border-radius:50%;background:var(--gold-soft)}
.bal-hero>*{position:relative;z-index:1}
.bal-lab{font-size:.68rem;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:7px}
.bal-amt{font-family:'Sora',sans-serif;font-size:2.35rem;font-weight:800;line-height:1.15;margin:6px 0 4px;background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.bal-amt small{font-size:.85rem;font-weight:700;-webkit-text-fill-color:var(--muted);color:var(--muted)}
.bal-mini{margin:0;padding:14px}
.bal-mini .bal-amt{font-size:1.28rem;margin:4px 0 2px}
.bal-mini .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:.9rem;background:var(--accent-soft);color:var(--accent)}
.bal-mini.tok .ic{background:var(--gold-soft);color:var(--gold)}
.bal-mini .tiny{display:block}

/* ---------- Quick actions ---------- */
.qa{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-size:.66rem;font-weight:700;text-align:center;color:var(--text)}
.qa i{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:1rem;background:var(--accent-soft);color:var(--accent)}
.qa:nth-child(even) i{background:var(--gold-soft);color:var(--gold)}
.qa:active{transform:scale(.94)}
.qa.off{opacity:.4}

/* ---------- Lists ---------- */
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:none}
.row:active{opacity:.7}
.ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:.95rem;flex-shrink:0;background:var(--accent-soft);color:var(--accent)}
.ico.pos{background:var(--pos-soft);color:var(--pos)}
.ico.neg{background:var(--neg-soft);color:var(--neg)}
.ico.gold{background:var(--gold-soft);color:var(--gold)}
.ico.info{background:var(--info-soft);color:var(--info)}
.ico.warn{background:var(--warn-soft);color:var(--warn)}
.rm{flex:1;min-width:0}
.rt1{font-size:.86rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt2{font-size:.7rem;color:var(--muted);font-weight:600;margin-top:2px}
.rr{text-align:right;flex-shrink:0}
.rv{font-size:.86rem;font-weight:800;font-family:'Sora',sans-serif}
.rv.pos{color:var(--pos)}.rv.neg{color:var(--neg)}
.pill{display:inline-block;font-size:.62rem;font-weight:800;padding:3px 9px;border-radius:99px;margin-top:3px}
.pill.ok{background:var(--pos-soft);color:var(--pos)}
.pill.pending{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--neg-soft);color:var(--neg)}
.pill.info{background:var(--info-soft);color:var(--info)}
.empty{text-align:center;padding:30px 14px;color:var(--muted)}
.empty i{font-size:1.9rem;opacity:.35;display:block;margin-bottom:10px}
.empty p{font-size:.82rem;font-weight:600;line-height:1.5}

/* ---------- Buttons / forms ---------- */
.btn{width:100%;padding:15px;border-radius:16px;background:var(--grad-accent);color:var(--on-accent);font-weight:800;font-size:.92rem;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:var(--glow);position:relative;overflow:hidden}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.gold{background:var(--grad-gold);color:#1a1205;box-shadow:none}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line2);box-shadow:none}
.btn.danger{background:var(--neg-soft);color:var(--neg);box-shadow:none;border:1px solid var(--neg)}
.btn.sm{width:auto;padding:10px 16px;font-size:.78rem;border-radius:12px}
.btn.inline{width:auto}
.btns{display:flex;gap:10px;margin-top:12px}
.btns .btn{flex:1}
.field{margin-bottom:13px}
.field label{display:flex;justify-content:space-between;font-size:.74rem;font-weight:700;color:var(--muted);margin-bottom:6px}
.field label b{color:var(--accent);font-weight:700;cursor:pointer}
.inp{width:100%;padding:14px 15px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-size:.92rem;font-weight:600;outline:none;transition:.2s}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp::placeholder{color:var(--faint)}
textarea.inp{min-height:96px;resize:vertical}
select.inp{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg fill='%23A89E91' height='20' viewBox='0 0 24 24' width='20' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:38px}
select.inp option{background:var(--card);color:var(--text)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:9px 15px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:.74rem;font-weight:700;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip .cnt{display:inline-block;margin-left:5px;font-size:.66rem;background:var(--card3);border-radius:99px;padding:1px 7px}
.seg{display:grid;gap:8px;margin-bottom:13px}
.seg.c2{grid-template-columns:1fr 1fr}
.seg button{padding:12px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-size:.8rem;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.seg button.dis{opacity:.4;pointer-events:none}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;font-size:.82rem;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:none}
.kv span{color:var(--muted);font-weight:600}
.kv b{font-weight:800;text-align:right;word-break:break-all}
.kv.big b{font-size:1.02rem;color:var(--pos)}
.kv .neg{color:var(--neg)}.kv .pos{color:var(--pos)}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:14px;font-size:.77rem;font-weight:600;line-height:1.55;margin-bottom:13px;background:var(--info-soft);color:var(--info)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--neg-soft);color:var(--neg)}
.note i{margin-top:2px}
.note span{white-space:pre-wrap}
.qbox{background:var(--accent-soft);border:1px solid var(--line2);border-radius:16px;padding:6px 14px;margin-bottom:13px}
.qerr{font-size:.78rem;font-weight:700;color:var(--neg);margin-bottom:13px}
.switch{position:relative;width:46px;height:27px;flex-shrink:0}
.switch input{display:none}
.switch i{position:absolute;inset:0;border-radius:99px;background:var(--card3);transition:.25s}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:21px;height:21px;border-radius:50%;background:var(--muted);transition:.25s}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i::after{left:22px;background:var(--on-accent)}

/* ---------- Market ---------- */
.mk-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.mk-name{display:flex;align-items:center;gap:11px}
.mk-logo{width:44px;height:44px;border-radius:15px;background:var(--grad-gold);display:grid;place-items:center;color:#1a1205;font-size:1.1rem;overflow:hidden}
.mk-logo img{width:100%;height:100%;object-fit:cover}
.mk-price{font-family:'Sora',sans-serif;font-size:2rem;font-weight:800;margin:14px 0 2px}
.mk-price small{font-size:.8rem;color:var(--muted)}
.chg{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:800;padding:4px 10px;border-radius:99px}
.chg.up{background:var(--pos-soft);color:var(--pos)}.chg.dn{background:var(--neg-soft);color:var(--neg)}.chg.na{background:var(--card3);color:var(--muted)}
.mm{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 6px}
.mm div{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.mm span{display:block;font-size:.64rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.mm b{font-family:'Sora',sans-serif;font-size:.95rem;font-weight:800}
.mm .lo b{color:var(--neg)}.mm .hi b{color:var(--pos)}
.range{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--neg-soft),var(--warn-soft),var(--pos-soft));position:relative;margin:16px 6px 8px;border:1px solid var(--line)}
.range i{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--grad-accent);border:3px solid var(--bg);transform:translate(-50%,-50%);box-shadow:var(--glow)}
.range-l{display:flex;justify-content:space-between;font-size:.66rem;color:var(--muted);font-weight:700}
.chart{margin-top:14px;border-radius:16px;background:var(--card2);border:1px solid var(--line);padding:10px 8px 6px}
.chart svg{width:100%;height:120px;display:block}
.chart-l{display:flex;justify-content:space-between;font-size:.64rem;color:var(--muted);font-weight:600;padding:2px 6px}
.src-tag{font-size:.64rem;font-weight:700;color:var(--gold);background:var(--gold-soft);padding:3px 9px;border-radius:99px;display:inline-block}
.op{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);position:relative}
.op i{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:1rem}
.op h4{font-size:.88rem}
.op p{font-size:.68rem;color:var(--muted);font-weight:600}
.op.off{opacity:.45}
.op:active{transform:scale(.97)}

/* ---------- Timeline ---------- */
.tl{padding:6px 0}
.tl .st{display:flex;gap:13px;position:relative;padding-bottom:18px}
.tl .st:last-child{padding-bottom:0}
.tl .st::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line2)}
.tl .st:last-child::before{display:none}
.tl .st.done::before{background:var(--pos)}
.tl .dotc{width:28px;height:28px;border-radius:50%;background:var(--card3);display:grid;place-items:center;font-size:.7rem;color:var(--faint);flex-shrink:0;z-index:1}
.tl .st.done .dotc{background:var(--pos);color:#06241b}
.tl .st.cur .dotc{background:var(--warn);color:#2b1c00;animation:pulse 1.6s infinite}
.tl .st.bad .dotc{background:var(--neg);color:#fff}
.tl b{font-size:.84rem;display:block}
.tl small{font-size:.7rem;color:var(--muted);font-weight:600}

/* ---------- Ads / tasks ---------- */
.ad-card{background:var(--card);border-radius:20px;padding:16px 10px;border:1px solid var(--line);text-align:center;cursor:pointer}
.ad-card:active{transform:scale(.96)}
.ad-card.done{opacity:.45}
.ad-card .ico{margin:0 auto 10px;width:48px;height:48px;font-size:1.15rem}
.ad-card h4{font-size:.84rem}
.ad-card p{font-size:.68rem;color:var(--muted);font-weight:600;margin-top:3px}
.ad-rw{display:inline-block;margin-top:8px;font-size:.72rem;font-weight:800;color:var(--pos);background:var(--pos-soft);padding:3px 12px;border-radius:99px}
.task-item{display:flex;align-items:center;gap:12px;padding:13px;background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;cursor:pointer}
.task-item.done{opacity:.5}
.task-ic{width:44px;height:44px;border-radius:14px;object-fit:cover;background:var(--card3);flex-shrink:0}
.task-go{font-size:.72rem;font-weight:800;padding:8px 14px;border-radius:99px;background:var(--grad-accent);color:var(--on-accent);white-space:nowrap}
.task-item.done .task-go{background:var(--pos-soft);color:var(--pos)}
.atask{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px;margin-bottom:12px;position:relative}
.atask .stats{display:flex;gap:8px;margin:10px 0}
.atask .stats div{flex:1;background:var(--card2);border-radius:12px;padding:8px;text-align:center;font-size:.66rem;font-weight:700;color:var(--muted)}
.atask .stats b{display:block;font-size:.84rem;color:var(--text);margin-top:2px}
.atask .lnk{font-size:.76rem;color:var(--info);word-break:break-all;font-weight:600}
.refbox{background:var(--accent-soft);border:1px dashed var(--accent);border-radius:14px;padding:13px;font-size:.76rem;font-weight:700;word-break:break-all;line-height:1.5;margin-bottom:12px;color:var(--accent2)}
.pbar{height:8px;border-radius:99px;background:var(--card3);overflow:hidden;margin:10px 0 6px}
.pbar b{display:block;height:100%;background:var(--grad-accent);border-radius:99px;transition:width .6s}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{padding:14px;border-radius:18px;background:var(--card2);border:2px solid var(--line);text-align:left}
.tile.on{border-color:var(--accent)}
.tile .sw{height:46px;border-radius:12px;margin-bottom:10px;border:1px solid var(--line2)}
.tile b{font-size:.82rem;display:block}.tile small{font-size:.66rem;color:var(--muted);font-weight:600}
.sw.obs{background:linear-gradient(135deg,#0A0807 0%,#2E1D0F 55%,#FF7A1A 100%)}
.sw.tit{background:linear-gradient(135deg,#060A15 0%,#14264E 55%,#3E8BFF 100%)}
.pstat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:center}
.pstat .ico{margin:0 auto 8px}
.pstat b{display:block;font-family:'Sora',sans-serif;font-size:1rem}
.pstat span{font-size:.64rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.bar-row{margin-bottom:12px}
.bar-row .bl{display:flex;justify-content:space-between;font-size:.76rem;font-weight:700;margin-bottom:5px}
.bar-row .bt{height:8px;border-radius:99px;background:var(--card3);overflow:hidden}
.bar-row .bt b{display:block;height:100%;background:var(--grad-accent)}
.msg{max-width:84%;padding:10px 13px;border-radius:16px;font-size:.82rem;font-weight:500;line-height:1.5;margin-bottom:10px;white-space:pre-wrap;word-break:break-word}
.msg.me{background:var(--accent-soft);border:1px solid var(--accent);margin-left:auto;border-bottom-right-radius:5px}
.msg.ad{background:var(--card2);border:1px solid var(--line2);border-bottom-left-radius:5px}
.msg small{display:block;font-size:.62rem;color:var(--muted);font-weight:600;margin-top:4px}
.msg img{max-width:100%;border-radius:10px;margin-top:6px}

/* ---------- Leaderboard ---------- */
.podium{display:flex;justify-content:center;align-items:flex-end;gap:9px;padding:12px 14px 20px}
.pod{flex:1;max-width:108px;background:var(--card);border:1px solid var(--line2);border-radius:20px;padding:14px 6px 12px;text-align:center;position:relative}
.pod.r1{transform:translateY(-14px) scale(1.06);order:2;background:linear-gradient(160deg,var(--gold-soft),var(--card));border-color:var(--gold)}
.pod.r2{order:1}.pod.r3{order:3}
.pod img{width:54px;height:54px;border-radius:17px;object-fit:cover;border:2px solid var(--gold)}
.pod .rk{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--grad-gold);color:#1a1205;font-size:.6rem;font-weight:800;padding:2px 10px;border-radius:99px}
.pod .nm{font-size:.72rem;font-weight:800;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .bg{font-size:.6rem;font-weight:800;padding:2px 8px;border-radius:99px;margin-top:5px;display:inline-block;background:var(--accent-soft);color:var(--accent)}
.lrow{display:flex;align-items:center;gap:11px;padding:11px 13px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin:0 16px 9px}
.lrow img{width:38px;height:38px;border-radius:12px;object-fit:cover}
.lrow .n{font-size:.78rem;font-weight:800;color:var(--accent);min-width:28px}

/* ---------- Sub pages / sheet / nav / toast ---------- */
.sub{position:fixed;inset:0;z-index:6000;background:var(--bg);overflow-y:auto;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.3,1);visibility:hidden;
  background-image:radial-gradient(ellipse 80% 40% at 0% -8%,var(--bgfx1),transparent 62%)}
.sub.show{transform:none;visibility:visible}
.sub-in{max-width:540px;margin:0 auto;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.sub-head{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:14px 16px;background:linear-gradient(var(--bg) 70%,transparent)}
.sub-head h2{font-size:1.08rem;flex:1}
.sheet-wrap{position:fixed;inset:0;z-index:7000;background:rgba(0,0,0,.62);backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center}
.sheet-wrap.show{display:flex}
.sheet{background:var(--card);border:1px solid var(--line2);border-bottom:none;border-radius:30px 30px 0 0;width:100%;max-width:540px;max-height:92vh;overflow-y:auto;padding:12px 18px calc(26px + env(safe-area-inset-bottom));animation:sUp .3s cubic-bezier(.2,.8,.3,1)}
@keyframes sUp{from{transform:translateY(100%)}to{transform:none}}
.grab{width:42px;height:4px;border-radius:99px;background:var(--line2);margin:0 auto 14px}
.sheet h3{font-size:1.05rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.res{text-align:center;padding:6px 0 4px}
.res .big{width:72px;height:72px;border-radius:24px;display:grid;place-items:center;font-size:1.8rem;margin:0 auto 12px}
.res .big.ok{background:var(--pos-soft);color:var(--pos)}.res .big.bad{background:var(--neg-soft);color:var(--neg)}
.res h3{justify-content:center}
.up-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;border:2px dashed var(--line2);border-radius:14px;color:var(--muted);font-size:.84rem;font-weight:700}
.up-btn.has{border-color:var(--pos);color:var(--pos)}
.qr{text-align:center;margin-bottom:12px}
.qr img{width:150px;height:150px;border-radius:14px;background:#fff;padding:8px;object-fit:contain}
.addr{background:var(--info-soft);border:1px dashed var(--info);border-radius:14px;padding:12px;text-align:center;margin-bottom:12px}
.addr b{display:block;font-size:.86rem;color:var(--info);word-break:break-all;line-height:1.5;margin:4px 0 8px}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:5000;display:flex;justify-content:center;background:color-mix(in srgb,var(--bg2) 88%,transparent);backdrop-filter:blur(22px);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.nav-in{display:flex;width:100%;max-width:540px}
.nv{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;border-radius:14px;color:var(--faint);position:relative}
.nv i{font-size:1.1rem}
.nv span{font-size:.6rem;font-weight:700;letter-spacing:.3px}
.nv.active{color:var(--accent)}
.nv.active::after{content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:26px;height:3px;border-radius:99px;background:var(--grad-accent);box-shadow:0 0 12px var(--accent)}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--card2);border:1px solid var(--line2);color:var(--text);padding:12px 22px;border-radius:99px;font-size:.82rem;opacity:0;pointer-events:none;transition:.3s;z-index:99999;font-weight:700;max-width:92vw;text-align:center;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sk{position:relative;color:transparent!important;-webkit-text-fill-color:transparent!important;border-radius:8px;background:linear-gradient(90deg,var(--card2),var(--card3),var(--card2))!important;background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.hint{font-size:.7rem;color:var(--muted);font-weight:600;margin-top:6px}
.sp{height:14px}
.link-row{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.link-row:last-child{border-bottom:none}
.link-row .ico{width:40px;height:40px}
.link-row .rm b{font-size:.86rem;display:block}
.link-row .rm small{font-size:.7rem;color:var(--muted);font-weight:600}
.link-row>i.ch{color:var(--faint);font-size:.75rem}
  body.no-taskbal .bal-mini:not(.tok){display:none!important}
  body.no-tokbal .bal-mini.tok{display:none!important}
  .lrow.me{border-color:var(--accent);background:var(--accent-soft)}
  .seg.c4{grid-template-columns:repeat(4,1fr)}

/* =====================================================================
   NEXAVAULT v3 — premium redesign layer (obsidian · graphite · refined orange · titanium)
===================================================================== */
:root,[data-theme="obsidian"]{
  --bg:#050507;--bg2:#0B0B0E;--card:#111115;--card2:#18181D;--card3:#222229;
  --line:rgba(255,255,255,.065);--line2:rgba(255,255,255,.13);
  --text:#F5F4F2;--muted:#A1A1AB;--faint:#666670;
  --accent:#FF7B1C;--accent2:#FFA14F;--accent-soft:rgba(255,123,28,.13);
  --gold:#C7CCD4;--gold2:#F1F3F6;--gold-soft:rgba(199,204,212,.11);
  --on-accent:#1A0C01;
  --grad-accent:linear-gradient(135deg,#FF6A00 0%,#FF9442 100%);
  --grad-gold:linear-gradient(135deg,#8E949E 0%,#F1F3F6 48%,#A3A9B3 100%);
  --grad-hero:linear-gradient(150deg,#1E1E24 0%,#121216 55%,#0B0B0E 100%);
  --glow:0 10px 34px rgba(255,123,28,.28);--shadow:0 18px 40px rgba(0,0,0,.55);
  --bgfx1:rgba(255,123,28,.11);--bgfx2:rgba(199,204,212,.05);
}
body{font-family:'Manrope','Plus Jakarta Sans','Hind Siliguri',sans-serif;letter-spacing:-.005em}
h1,h2,h3,h4,.num,.bal-amt,.mk-price,.rv{font-family:'Sora','Manrope','Hind Siliguri',sans-serif;font-variant-numeric:tabular-nums}
.app{padding-bottom:calc(112px + env(safe-area-inset-bottom))}

/* surfaces */
.card{border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0) 42%),var(--card);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 8px 22px rgba(0,0,0,.28)}
.card.flat{padding:4px 16px}
.card-t{font-size:.9rem;letter-spacing:-.01em}
.card-t i{width:28px;height:28px;border-radius:9px;display:inline-grid;place-items:center;font-size:.78rem;background:var(--accent-soft)}
.sec{font-size:.7rem;letter-spacing:1.6px;color:var(--faint);padding:10px 20px 10px}
.avatar{border:0;border-radius:17px;box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--accent)}
.iconbtn{border-radius:15px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,0)),var(--card);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.dot{box-shadow:0 0 0 2px var(--bg),0 0 12px var(--accent)}

/* wallet hero */
.card.hero{background:radial-gradient(120% 95% at 100% 0%,rgba(255,123,28,.30),transparent 52%),radial-gradient(90% 70% at 0% 100%,rgba(199,204,212,.11),transparent 62%),var(--grad-hero);border:1px solid rgba(255,255,255,.12);border-radius:28px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.09)}
.bal-hero{padding:22px 20px 20px}
.bal-hero::before{content:"";position:absolute;inset:0;width:auto;height:auto;right:auto;top:auto;border-radius:inherit;filter:none;background:repeating-linear-gradient(118deg,rgba(255,255,255,.04) 0 1px,transparent 1px 8px);-webkit-mask-image:linear-gradient(180deg,#000,transparent 70%);mask-image:linear-gradient(180deg,#000,transparent 70%)}
.bal-hero::after{content:"";position:absolute;left:auto;top:auto;right:-80px;bottom:-100px;width:230px;height:230px;border-radius:50%;background:none;border:1px solid rgba(255,255,255,.08);box-shadow:0 0 0 28px rgba(255,255,255,.02),0 0 0 58px rgba(255,255,255,.012)}
.bal-lab{color:var(--muted);letter-spacing:2px}
.bal-amt{font-size:2.55rem;font-weight:800;letter-spacing:-.03em}
.bal-mini{border-radius:22px}
.bal-mini .ic{border-radius:12px;background:linear-gradient(135deg,var(--accent-soft),transparent)}

/* actions & rows */
.qa{border-radius:20px;padding:14px 4px 12px;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0)),var(--card);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);transition:transform .18s,border-color .2s}
.qa i{border-radius:15px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.qa:active{border-color:var(--accent)}
.row{padding:13px 0}
.ico{border-radius:15px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.task-item,.atask,.ad-card,.op,.pstat,.lrow{border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0)),var(--card);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.btn{border-radius:17px;padding:16px;letter-spacing:.01em;box-shadow:var(--glow),inset 0 1px 0 rgba(255,255,255,.28);transition:transform .15s,filter .2s}
.btn:active{filter:brightness(.92)}
.btn.ghost{background:var(--card2);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.btn.gold{box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.inp{border-radius:15px;background:var(--bg2);border:1px solid var(--line2)}
.chip{padding:9px 16px;border-radius:99px;background:var(--card);transition:.2s}
.chip.on{background:var(--grad-accent);color:var(--on-accent);border-color:transparent;box-shadow:var(--glow)}
.chip.on .cnt{background:rgba(0,0,0,.2);color:var(--on-accent)}
.pill{letter-spacing:.2px}

/* floating navigation */
.nav{background:transparent;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;padding:0 14px calc(12px + env(safe-area-inset-bottom));pointer-events:none;box-shadow:none}
.nav-in{pointer-events:auto;gap:2px;padding:7px;border-radius:28px;background:rgba(18,18,22,.78);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);border:1px solid var(--line2);box-shadow:0 18px 44px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.07)}
.nv{padding:9px 2px 8px;border-radius:21px;transition:background .25s,color .25s,transform .15s}
.nv:active{transform:scale(.92)}
.nv.active{color:var(--accent);background:linear-gradient(180deg,var(--accent-soft),rgba(255,123,28,.03))}
.nv.active i{filter:drop-shadow(0 0 8px rgba(255,123,28,.55))}
.nv.active::after{top:auto;bottom:2px;width:4px;height:4px;border-radius:50%;box-shadow:0 0 8px var(--accent)}

/* token market */
.mkcard{padding:20px}
.mkcard .mk-logo{background:var(--grad-accent);color:var(--on-accent);box-shadow:var(--glow);border-radius:16px}
.mkcard .mk-price{font-size:2.8rem;letter-spacing:-.04em;line-height:1.05;margin:8px 0 6px}
.mkcard .mk-price .js-mk-price{background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.mkcard .mk-price small{-webkit-text-fill-color:var(--muted);color:var(--muted);font-weight:700}
.mkcard .chart{background:rgba(0,0,0,.32);border:1px solid var(--line);border-radius:20px;padding:12px 8px 8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.mkcard .chart svg{height:150px}
.mm div{border-radius:16px;background:rgba(0,0,0,.25)}
.chg{backdrop-filter:blur(6px);font-weight:800}
.op{padding:16px}
.op i{border-radius:14px}

/* leaderboard / podium */
.pod{border-radius:22px}
.pod.r1{box-shadow:0 14px 34px rgba(0,0,0,.5),0 0 0 1px rgba(199,204,212,.3)}

/* sheets & sub pages */
.sheet-wrap{background:rgba(0,0,0,.66)}
.sheet{border-radius:32px 32px 0 0;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0) 30%),var(--card);box-shadow:0 -20px 60px rgba(0,0,0,.6)}
.sub-head{backdrop-filter:blur(14px)}
.sub-head h2{font-size:1.1rem;letter-spacing:-.02em}
.toast{border-radius:18px;backdrop-filter:blur(18px);background:rgba(28,28,34,.9);box-shadow:0 14px 40px rgba(0,0,0,.55)}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:.78rem}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* notification centre */
.nc-hd{display:flex;justify-content:space-between;align-items:baseline;padding:4px 20px 12px;font-size:.84rem;font-weight:700}
.nc-hd b{font-family:'Sora',sans-serif;font-size:1.5rem;color:var(--accent);margin-right:4px}
.nc-wrap{padding:0 16px}
.nc-day{font-size:.66rem;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint);padding:14px 4px 8px}
.nc{display:flex;gap:13px;padding:14px;border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0)),var(--card);border:1px solid var(--line);margin-bottom:10px;cursor:pointer;transition:transform .15s,border-color .2s;animation:ncIn .35s cubic-bezier(.2,.8,.3,1) both}
@keyframes ncIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.nc:active{transform:scale(.985)}
.nc.unread{background:linear-gradient(120deg,var(--accent-soft),transparent 62%),var(--card);border-color:rgba(255,123,28,.3)}
.nc-ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:1.1rem;flex-shrink:0;background:var(--card3);color:var(--muted);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.nc-em{font-size:1.35rem;line-height:1}
.nc.st-success .nc-ic,.ncd-hero.st-success .ncd-ic{background:var(--pos-soft)}
.nc.st-failed .nc-ic,.ncd-hero.st-failed .ncd-ic{background:var(--neg-soft)}
.nc.st-pending .nc-ic,.nc.st-processing .nc-ic,.ncd-hero.st-pending .ncd-ic,.ncd-hero.st-processing .ncd-ic{background:var(--warn-soft)}
.nc.st-info .nc-ic,.ncd-hero.st-info .ncd-ic{background:var(--accent-soft);color:var(--accent)}
.nc-b{flex:1;min-width:0}
.nc-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.6rem;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--muted)}
.nc-time{display:inline-flex;align-items:center;font-weight:700;letter-spacing:0;text-transform:none;color:var(--faint)}
.nc-dot{display:inline-block;width:8px;height:8px;margin-left:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.nc-t{font-size:.92rem;font-weight:800;margin:4px 0 3px;letter-spacing:-.01em}
.nc:not(.unread) .nc-t{color:var(--muted);font-weight:700}
.nc-s{font-size:.74rem;color:var(--muted);font-weight:600;line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.nc-meta{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.nc-ref{font-family:ui-monospace,Menlo,monospace;font-size:.62rem;color:var(--faint);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nc-tgf{font-size:.62rem;font-weight:800;color:var(--warn)}
.ncd-hero{text-align:center;padding:2px 0 16px}
.ncd-ic{width:72px;height:72px;border-radius:24px;display:grid;place-items:center;margin:0 auto 12px;font-size:1.7rem;color:var(--accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.ncd-ic .nc-em{font-size:2.1rem}
.ncd-t{font-family:'Sora',sans-serif;font-size:1.12rem;font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
.ncd-m{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.ncd-copy{color:var(--accent);padding:2px 6px;font-size:.8rem}
.nc-foot{text-align:center;font-size:.7rem;font-weight:700;color:var(--faint);margin:2px 0 14px;letter-spacing:.3px}
/* ===== single leaderboard ===== */
.lbhero{margin-bottom:12px}
.lbhero-s{font-size:.82rem;color:var(--muted);padding:6px 0 4px}
.lbcd{font-family:'Sora',sans-serif;font-size:1.65rem;font-weight:800;letter-spacing:-.02em;margin:4px 0 4px;color:var(--text)}
.lbstats{display:flex;gap:10px;margin-top:14px}
.lbstats>div{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:9px 10px;text-align:center}
.lbstats b{display:block;font-size:.92rem}
.lbstats span{font-size:.62rem;color:var(--muted);font-weight:700}
.lbrw{display:flex;flex-wrap:wrap;gap:8px}
.lbrw-i{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:14px;background:var(--card3);border:1px solid var(--line);font-size:.8rem}
.lbrw-i .m{font-size:.95rem}
.lbrw-i small{color:var(--muted);font-weight:700}
.lbrw-i.r1{background:linear-gradient(160deg,var(--gold-soft),var(--card));border-color:var(--gold)}
.lbres-d{margin-left:auto;font-size:.66rem;color:var(--muted);font-weight:600}
.lbw{display:flex;align-items:center;gap:11px;padding:10px 4px;border-bottom:1px solid var(--line)}
.lbw:last-child{border-bottom:none}
.lbw.me{background:var(--accent-soft);border-radius:14px;padding-left:10px;padding-right:10px}
.lbw img{width:38px;height:38px;border-radius:12px;object-fit:cover}
.lbw-r{min-width:30px;text-align:center;font-size:1.05rem;font-weight:800}
.lbw-a{font-weight:800;font-size:.9rem;color:var(--pos);white-space:nowrap}
.lbw-a small{font-size:.62rem;color:var(--muted)}

/* =====================================================================
   NEXAVAULT v4 — AURORA GLASS · three colour-combo themes
   Crimson × Gold  |  Royal Violet × Aqua  |  Ocean Teal × Coral
===================================================================== */
:root,[data-theme="crimson"]{
  --bg:#0D0508;--bg2:#15080D;--card:#1B0B11;--card2:#26101A;--card3:#361522;
  --line:rgba(255,214,222,.08);--line2:rgba(255,214,222,.17);
  --text:#FFF4F6;--muted:#C9A9B2;--faint:#86646E;
  --accent:#FF3652;--accent2:#FF8296;--accent-soft:rgba(255,54,82,.16);--acc-rgb:240,36,62;
  --gold:#F6C66E;--gold2:#FFE4A8;--gold-soft:rgba(246,198,110,.15);--sec-rgb:246,198,110;
  --pos:#35E0A0;--neg:#FF7A6B;--warn:#FFC857;--info:#6CC4FF;--pos-rgb:53,224,160;--info-rgb:108,196,255;
  --pos-soft:rgba(53,224,160,.14);--neg-soft:rgba(255,122,107,.15);--warn-soft:rgba(255,200,87,.15);--info-soft:rgba(108,196,255,.14);
  --on-accent:#fff;
  --grad-accent:linear-gradient(135deg,#E3102B 0%,#FF4A64 100%);
  --grad-gold:linear-gradient(135deg,#B7852A 0%,#FFE4A8 50%,#DDA843 100%);
  --vivid:linear-gradient(135deg,#B90A20 0%,#E5233F 48%,#8A0818 100%);
  --grad-hero:linear-gradient(150deg,#2A0F18 0%,#1B0B11 60%,#12070B 100%);
  --glow:0 12px 30px rgba(240,36,62,.42);--shadow:0 18px 40px rgba(0,0,0,.55);
  --bgfx1:rgba(240,36,62,.2);--bgfx2:rgba(246,198,110,.08);--navbg:rgba(21,8,13,.82);
}
[data-theme="violet"]{
  --bg:#07061A;--bg2:#0D0B26;--card:#131032;--card2:#1C1946;--card3:#292560;
  --line:rgba(200,195,255,.09);--line2:rgba(200,195,255,.18);
  --text:#F3F1FF;--muted:#ADA9DB;--faint:#6F6C9C;
  --accent:#8269FF;--accent2:#AD9DFF;--accent-soft:rgba(130,105,255,.18);--acc-rgb:116,88,255;
  --gold:#34E3E8;--gold2:#A2F5F7;--gold-soft:rgba(52,227,232,.13);--sec-rgb:52,227,232;
  --pos:#3BE3A4;--neg:#FF6F8B;--warn:#FFC75A;--info:#6FB8FF;--pos-rgb:59,227,164;--info-rgb:111,184,255;
  --pos-soft:rgba(59,227,164,.14);--neg-soft:rgba(255,111,139,.15);--warn-soft:rgba(255,199,90,.15);--info-soft:rgba(111,184,255,.14);
  --on-accent:#fff;
  --grad-accent:linear-gradient(135deg,#5A3CF2 0%,#9A7DFF 100%);
  --grad-gold:linear-gradient(135deg,#13B3C0 0%,#BDFBFF 50%,#2FD6DC 100%);
  --vivid:linear-gradient(135deg,#4627D6 0%,#7C58FF 50%,#33189E 100%);
  --grad-hero:linear-gradient(150deg,#1E1A52 0%,#131032 60%,#0C0A24 100%);
  --glow:0 12px 30px rgba(100,70,250,.45);--shadow:0 18px 40px rgba(0,0,0,.55);
  --bgfx1:rgba(116,88,255,.22);--bgfx2:rgba(52,227,232,.08);--navbg:rgba(13,11,38,.82);
}
[data-theme="teal"]{
  --bg:#031110;--bg2:#071A1A;--card:#0B2123;--card2:#102D30;--card3:#18403F;
  --line:rgba(190,255,245,.08);--line2:rgba(190,255,245,.17);
  --text:#EFFFFC;--muted:#9EC9C3;--faint:#5E8884;
  --accent:#16C9B6;--accent2:#63EBDC;--accent-soft:rgba(22,201,182,.17);--acc-rgb:18,190,172;
  --gold:#FF8B6C;--gold2:#FFC4B0;--gold-soft:rgba(255,139,108,.15);--sec-rgb:255,139,108;
  --pos:#5EE88F;--neg:#FF6B7A;--warn:#FFC857;--info:#6CC0FF;--pos-rgb:94,232,143;--info-rgb:108,192,255;
  --pos-soft:rgba(94,232,143,.14);--neg-soft:rgba(255,107,122,.15);--warn-soft:rgba(255,200,87,.15);--info-soft:rgba(108,192,255,.14);
  --on-accent:#02231F;
  --grad-accent:linear-gradient(135deg,#0DAA9B 0%,#33E0CC 100%);
  --grad-gold:linear-gradient(135deg,#E8643F 0%,#FFD0C0 50%,#FF8F70 100%);
  --vivid:linear-gradient(135deg,#066E69 0%,#10B3A3 52%,#07524F 100%);
  --grad-hero:linear-gradient(150deg,#0E3A3A 0%,#0B2123 60%,#071718 100%);
  --glow:0 12px 30px rgba(18,190,172,.38);--shadow:0 18px 40px rgba(0,0,0,.55);
  --bgfx1:rgba(18,190,172,.2);--bgfx2:rgba(255,139,108,.08);--navbg:rgba(7,26,26,.82);
}
body{background-image:radial-gradient(120% 55% at 0% -8%,rgba(var(--acc-rgb),.22),transparent 62%),radial-gradient(90% 45% at 100% 2%,rgba(var(--sec-rgb),.10),transparent 62%),radial-gradient(90% 40% at 50% 112%,rgba(var(--acc-rgb),.12),transparent 62%)}
.sub{background-image:radial-gradient(120% 40% at 0% -8%,rgba(var(--acc-rgb),.2),transparent 62%)}
.ld-logo,.cj-icon,.mkcard .mk-logo{color:var(--on-accent)}

/* header card */
.top{margin:12px 16px 14px;padding:12px;border-radius:26px;background:linear-gradient(135deg,rgba(var(--acc-rgb),.2),rgba(var(--sec-rgb),.05)),var(--card);border:1px solid var(--line2);box-shadow:0 14px 34px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08)}
.avatar{width:52px;height:52px;border-radius:50%;box-shadow:0 0 0 2px var(--card),0 0 0 4px rgba(var(--sec-rgb),.9),0 6px 16px rgba(0,0,0,.4)}
.who h3{font-size:1rem;font-weight:800}
.who h3.hi::after{content:" 👋"}
.who p{font-size:.68rem}
.badge{background:var(--grad-accent);color:var(--on-accent);box-shadow:0 4px 10px rgba(var(--acc-rgb),.3)}
.badge.warn{background:var(--warn-soft);color:var(--warn);box-shadow:none}
.badge.bad{background:var(--neg-soft);color:var(--neg);box-shadow:none}
.iconbtn{width:44px;height:44px;border-radius:50%;background:rgba(var(--acc-rgb),.16);border:1px solid rgba(var(--acc-rgb),.35);color:var(--accent2);box-shadow:0 6px 16px rgba(var(--acc-rgb),.2)}
.dot{background:var(--grad-accent);color:var(--on-accent)}

/* surfaces */
.card{border-radius:26px;background:linear-gradient(160deg,rgba(var(--acc-rgb),.08),rgba(255,255,255,0) 46%),var(--card);border:1px solid var(--line2);box-shadow:0 12px 28px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.06)}
.card-t i{background:rgba(var(--acc-rgb),.18);color:var(--accent2);border-radius:11px;width:30px;height:30px}
.card.hero{background:radial-gradient(120% 100% at 100% 0%,rgba(var(--acc-rgb),.34),transparent 56%),radial-gradient(90% 70% at 0% 100%,rgba(var(--sec-rgb),.14),transparent 60%),var(--card2);border:1px solid rgba(var(--acc-rgb),.38);border-radius:28px;box-shadow:0 18px 40px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.03),inset 0 1px 0 rgba(255,255,255,.1)}

/* vivid balance card */
.card.hero.bal-hero{--text:#fff;--muted:rgba(255,255,255,.8);--faint:rgba(255,255,255,.62);color:#fff;padding:22px 20px 20px;background:linear-gradient(118deg,rgba(255,255,255,.2) 0%,rgba(255,255,255,0) 30%),var(--vivid);border:1px solid rgba(255,255,255,.26);box-shadow:0 22px 46px rgba(var(--acc-rgb),.42),inset 0 1px 0 rgba(255,255,255,.4)}
.bal-hero::before{content:"";position:absolute;inset:0;width:auto;height:auto;right:auto;top:auto;filter:none;border-radius:inherit;background:radial-gradient(60% 90% at 88% -10%,rgba(255,255,255,.3),transparent 62%),repeating-linear-gradient(120deg,rgba(255,255,255,.05) 0 1px,transparent 1px 9px);-webkit-mask-image:none;mask-image:none}
.bal-hero::after{content:"\f51e";font-family:"Font Awesome 6 Free";font-weight:900;position:absolute;left:auto;top:auto;right:16px;bottom:8px;width:auto;height:auto;border:0;box-shadow:none;border-radius:0;font-size:5.6rem;line-height:1;background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;opacity:.42;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35));pointer-events:none}
.bal-hero .bal-amt{background:linear-gradient(180deg,#fff 35%,rgba(255,255,255,.8));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none}
.bal-hero .bal-amt small{-webkit-text-fill-color:rgba(255,255,255,.85);color:rgba(255,255,255,.85)}
.bal-hero .tiny,.bal-hero .bal-lab{color:rgba(255,255,255,.82)}
.bal-mini{border-radius:24px;background:linear-gradient(150deg,rgba(var(--acc-rgb),.2),rgba(var(--acc-rgb),.03) 70%),var(--card)}
.bal-mini.tok{background:linear-gradient(150deg,rgba(var(--sec-rgb),.2),rgba(var(--sec-rgb),.03) 70%),var(--card)}
.bal-mini .ic{width:38px;height:38px;border-radius:50%;background:rgba(var(--acc-rgb),.22);color:var(--accent2)}
.bal-mini.tok .ic{background:rgba(var(--sec-rgb),.22);color:var(--gold)}
.bal-mini .bal-amt{background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

/* section titles */
.sec{font-size:.98rem;font-weight:800;letter-spacing:-.01em;text-transform:none;color:var(--text);padding:8px 20px 12px}
.sec span{display:inline-flex;align-items:center;gap:10px}
.sec span::before{content:"";width:4px;height:19px;border-radius:4px;background:var(--grad-accent);box-shadow:0 0 12px rgba(var(--acc-rgb),.7)}
.sec a,.sec button{padding:6px 13px;border-radius:99px;background:rgba(var(--acc-rgb),.15);border:1px solid rgba(var(--acc-rgb),.32);color:var(--accent2);font-size:.7rem}

/* quick-action tiles */
.qa{--tc:var(--acc-rgb);position:relative;border-radius:24px;padding:15px 4px 14px;gap:8px;background:linear-gradient(160deg,rgba(var(--tc),.2),rgba(var(--tc),.04) 70%),var(--card);border:1px solid rgba(var(--tc),.3);box-shadow:0 8px 18px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.06)}
.qa:nth-child(4n+2){--tc:var(--sec-rgb)}.qa:nth-child(4n+3){--tc:var(--pos-rgb)}.qa:nth-child(4n+4){--tc:var(--info-rgb)}
.qa i,.qa:nth-child(even) i{width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,rgba(var(--tc),.34),rgba(var(--tc),.12));color:rgb(var(--tc));box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 14px rgba(var(--tc),.22)}
.qa::after{content:"\f054";font-family:"Font Awesome 6 Free";font-weight:900;position:absolute;right:7px;top:7px;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font-size:.45rem;color:#fff;background:rgb(var(--tc));box-shadow:0 3px 8px rgba(var(--tc),.5)}
.qa:active{border-color:rgb(var(--tc))}

/* leaderboard banner (home) */
.lbban{display:flex;align-items:center;gap:12px;margin:0 16px 14px;padding:14px 14px 14px 16px;border-radius:26px;cursor:pointer;background:linear-gradient(110deg,rgba(var(--sec-rgb),.22),rgba(var(--sec-rgb),0) 45%),var(--vivid);border:1px solid rgba(255,255,255,.22);box-shadow:0 16px 34px rgba(var(--acc-rgb),.34),inset 0 1px 0 rgba(255,255,255,.3);color:#fff;position:relative;overflow:hidden}
.lbban-ic{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:1.7rem;color:#2a1a00;background:var(--grad-gold);box-shadow:0 8px 18px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.5);flex-shrink:0}
.lbban-t{flex:1;min-width:0}.lbban-t b{display:block;font-family:'Sora',sans-serif;font-size:1.1rem}.lbban-t span{font-size:.72rem;font-weight:600;opacity:.85}
.lbban-b{padding:10px 16px;border-radius:99px;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.7);color:#fff;font-weight:800;font-size:.76rem;white-space:nowrap}
.lbban:active{transform:scale(.985)}

/* buttons / chips / pills */
.btn{min-height:52px;border-radius:19px;background:var(--grad-accent);color:var(--on-accent);box-shadow:var(--glow),inset 0 1px 0 rgba(255,255,255,.32)}
.btn::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 32%,rgba(255,255,255,.24) 48%,transparent 64%);transform:translateX(-130%);animation:shine 4s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.btn:disabled::before,.btn.ghost::before,.btn.danger::before,.btn.gold::before{display:none}
.btn.gold{background:var(--grad-gold);color:#241500;box-shadow:0 10px 24px rgba(var(--sec-rgb),.28),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.ghost{background:rgba(var(--acc-rgb),.1);border:1px solid rgba(var(--acc-rgb),.35);color:var(--text)}
.task-go{background:var(--grad-accent);color:var(--on-accent);box-shadow:0 6px 14px rgba(var(--acc-rgb),.3)}
.chip{background:rgba(var(--sec-rgb),.09);border:1px solid rgba(var(--sec-rgb),.3);color:var(--gold2)}
.chip.on{background:var(--grad-accent);color:var(--on-accent);border-color:transparent;box-shadow:var(--glow)}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid color-mix(in srgb,currentColor 38%,transparent);padding:3px 10px}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.inp{border-radius:17px;background:rgba(0,0,0,.28);border:1px solid var(--line2)}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.2)}
.ico{border-radius:50%}
.switch input:checked+i{background:var(--grad-accent)}
.pbar b,.bar-row .bt b{background:var(--grad-accent);box-shadow:0 0 10px rgba(var(--acc-rgb),.5)}

/* lists / stats */
.task-item,.atask,.ad-card,.op,.pstat,.lrow{border-radius:22px;border:1px solid var(--line2);background:linear-gradient(160deg,rgba(var(--acc-rgb),.09),rgba(255,255,255,0) 55%),var(--card)}
.pstat .ico{background:linear-gradient(145deg,rgba(var(--acc-rgb),.3),rgba(var(--acc-rgb),.1))}
.tile{border-radius:20px}
.tile.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.18),var(--glow)}
.tiles{grid-template-columns:repeat(3,1fr);gap:10px}
.tile{padding:10px}.tile .sw{height:54px}.tile b{font-size:.72rem}.tile small{font-size:.6rem}
.sw.crm{background:linear-gradient(135deg,#0D0508 0%,#B90A20 52%,#F6C66E 100%)}
.sw.vio{background:linear-gradient(135deg,#07061A 0%,#5A3CF2 52%,#34E3E8 100%)}
.sw.tea{background:linear-gradient(135deg,#031110 0%,#0DAA9B 52%,#FF8B6C 100%)}

/* floating navigation */
.nav-in{border-radius:32px;padding:8px;gap:2px;background:var(--navbg);border:1px solid var(--line2);box-shadow:0 20px 46px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.03),inset 0 1px 0 rgba(255,255,255,.08)}
.nv{padding:6px 2px 5px;gap:3px;border-radius:22px}
.nv i{width:46px;height:34px;display:grid;place-items:center;border-radius:16px;font-size:1.05rem;transition:.25s}
.nv span{font-size:.6rem}
.nv.active{background:none;color:var(--accent2)}
.nv.active i{background:var(--grad-accent);color:var(--on-accent);box-shadow:var(--glow),inset 0 1px 0 rgba(255,255,255,.34);filter:none}
.nv.active::after{display:none}

/* leaderboard */
.lbhero.hero{background:linear-gradient(118deg,rgba(255,255,255,.18),rgba(255,255,255,0) 32%),var(--vivid);border-color:rgba(255,255,255,.26);--text:#fff;--muted:rgba(255,255,255,.8);--faint:rgba(255,255,255,.62);color:#fff}
.lbhero .card-t i{background:rgba(255,255,255,.18);color:#fff}
.lbhero .pill{background:rgba(255,255,255,.16);color:#fff}
.lbcd{background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-size:1.9rem}
.lbstats>div{background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.14);border-radius:16px}
.lbstats .pos{color:#fff}
.lbrw-i{border-radius:16px;background:rgba(var(--acc-rgb),.1);border:1px solid rgba(var(--acc-rgb),.28)}

function adjust(path, delta) {
  return db.ref(path).transaction(cur => {
    if (cur === null) return delta >= 0 ? rnd(delta, 6) : null;
    const n = rnd(num(cur) + delta, 6);
    if (n < -1e-9) return;               /* never allow negative balances */
    return n;
  }).then(r => r.committed && r.snapshot.exists()).catch(() => false);
}

  }
  return true;
}

function drawTicket(id) {

<script>
/* =====================================================================
   TOKEN SYSTEM — market overview + buy / sell / swap / transfer
   Config lives at  config/token  (admin controlled). Nothing is hard-coded.
===================================================================== */
const TKC = () => (S.cfg.token && typeof S.cfg.token === 'object') ? S.cfg.token : null;
function tokenState() { const c = TKC(); if (!c) return 'none'; if (c.enabled === false) return 'off'; return 'on'; }
const tsym = () => (TKC() && TKC().symbol) || 'TOKEN';
const tname = () => (TKC() && TKC().name) || t('token');
const priceDp = () => { const p = tprice(); return p >= 100 ? 2 : p >= 1 ? 4 : 6; };
const tokenValue = () => num(S.user.tokenBalance) * tprice();
const DP = a => a === 'token' ? 4 : 2;
const unitTxt = a => a === 'token' ? tsym() : a === 'task' ? sym() + ' (' + t('task_bal_short') + ')' : sym();
const opCfg = type => { const c = TKC(); return (c && c[type] && typeof c[type] === 'object') ? c[type] : {}; };
function tokLogo() { const c = TKC(); return (c && c.logo && safeUrl(c.logo)) ? '<img src="' + esc(c.logo) + '" onerror="this.remove()">' : '<i class="fas fa-coins"></i>'; }
function opState(type) {
  const ts = tokenState(); if (ts !== 'on') return ts;
  if (mkParams().paused) return 'off';
  const o = opCfg(type);
  if (!Object.keys(o).length) return 'none';
  if (o.enabled === false) return 'off';
  if (!(opRate(type) > 0)) return 'none';
  if (type === 'transfer' && o.toMainEnabled === false && o.toTaskEnabled === false) return 'off';
  return 'on';
}
function priceChange() {
  const c = TKC(); if (!c) return null;
  const mc = mkChange(); if (mc !== undefined) return mc;
  const p = tprice(); if (!(p > 0)) return null;
  let prev = num(c.prevPrice);
  if (!(prev > 0)) {
    const h = S.priceHist;
    for (let i = h.length - 1; i >= 0; i--) { const v = num(h[i].price); if (v > 0 && Math.abs(v - p) > 1e-12) { prev = v; break; } }
  }
  if (!(prev > 0)) return null;
  return (p - prev) / prev * 100;
}
function chgHtml(pc) {
  if (pc === null) return '<span class="chg na">—</span>';
  return '<span class="chg ' + (pc >= 0 ? 'up' : 'dn') + '"><i class="fas fa-arrow-' + (pc >= 0 ? 'trend-up' : 'trend-down') + '"></i>' + (pc >= 0 ? '+' : '') + pc.toFixed(2) + '%</span>';
}
function priceSrcLabel() {
  if (mkParams().auto || mkParams().paused) return simBadge();
  const c = TKC() || {}, ts = num(c.priceUpdatedAt || c.updatedAt);
  return '<span class="src-tag">' + (c.priceSource === 'external' ? t('mk_live') : t('mk_admin')) + '</span>' + (ts ? ' <span class="tiny">' + t('updated') + ': ' + fdt(ts) + '</span>' : '');
}
function rangeHtml() {
  const c = TKC() || {}, mn = num(c.minPrice), mx = num(c.maxPrice), p = tprice();
  if (!(mn > 0) || !(mx > mn)) return '';
  const pos = Math.max(0, Math.min(100, (p - mn) / (mx - mn) * 100)), d = priceDp();
  return '<div class="mm"><div class="lo"><span>' + t('min_price') + '</span><b>' + fmt(mn, d) + '</b></div><div class="hi"><span>' + t('max_price') + '</span><b>' + fmt(mx, d) + '</b></div></div>' +
    '<div class="range"><i style="left:' + pos + '%"></i></div><div class="range-l"><span>' + fmt(mn, d) + '</span><span>' + t('price_range') + '</span><span>' + fmt(mx, d) + '</span></div>';
}
function priceChartHtml() {
  const h = S.priceHist.filter(x => num(x.price) > 0);
  if (h.length < 2) return '';
  const W = 300, H = 120, pd = 8, vals = h.map(x => num(x.price)), mn = Math.min(...vals), mx = Math.max(...vals), span = (mx - mn) || 1;
  const pts = vals.map((v, i) => [pd + i * (W - 2 * pd) / (vals.length - 1), H - pd - (v - mn) / span * (H - 2 * pd)]);
  const line = pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const area = pd + ',' + (H - pd) + ' ' + line + ' ' + (W - pd) + ',' + (H - pd);
  const up = vals[vals.length - 1] >= vals[0];
  return '<div class="chart"><svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + (up ? 'var(--pos)' : 'var(--neg)') + '" stop-opacity=".35"/><stop offset="1" stop-color="' + (up ? 'var(--pos)' : 'var(--neg)') + '" stop-opacity="0"/></linearGradient></defs><polygon points="' + area + '" fill="url(#cg)"/><polyline points="' + line + '" fill="none" stroke="' + (up ? 'var(--pos)' : 'var(--neg)') + '" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></svg><div class="chart-l"><span>' + fdate(h[0].ts) + '</span><span>' + fdate(h[h.length - 1].ts) + '</span></div></div>';
}
function marketCard() {
  const p = tprice(), d = priceDp();
  return '<div class="card hero mkcard"><div class="mk-head"><div class="mk-name"><div class="mk-logo">' + tokLogo() + '</div><div><b>' + esc(tname()) + '</b><div class="tiny">' + esc(tsym()) + '</div></div></div><span class="js-mk-chg">' + chgHtml(priceChange()) + '</span></div>' +
    '<div class="tiny" style="margin-top:14px">' + t('cur_price') + '</div><div class="mk-price num" style="margin-top:2px"><span class="js-mk-price">' + (p > 0 ? fmt(p, d) : '—') + '</span> <small>' + sym() + '</small></div>' +
    rangeHtml() + (candleList(40, 1).length ? mkChartHtml() : priceChartHtml()) + '<div style="margin-top:12px">' + priceSrcLabel() + '</div></div>';
}
function holdingsCard() {
  const u = S.user, r = S.userReady;
  return '<div class="card"><div class="card-t"><i class="fas fa-gem"></i> ' + t('your_holdings') + '</div>' +
    kv(t('token_bal'), skv(fmt(u.tokenBalance, 4) + ' ' + esc(tsym()))) + kv(t('cur_price'), tprice() > 0 ? fmt(tprice(), priceDp()) + ' ' + sym() : '—') +
    kv(t('est_value'), r && tprice() > 0 ? '<span class="pos">' + fmt(tokenValue()) + ' ' + sym() + '</span>' : (r ? '—' : skv(''))) + '</div>';
}
function unavailable(st) { return '<div class="card" style="margin-top:4px">' + emptyHtml(st === 'off' ? 'fa-screwdriver-wrench' : 'fa-gear', t(st === 'off' ? 'tk_off_msg' : 'tk_none_msg')) + '</div>'; }
let TKF = 'all';
function renderToken() {
  const st = tokenState();
  let h = '<div class="top"><div><h1 class="h1">' + t('nav_token') + '</h1><div class="tiny">' + t('token_sub') + '</div></div><button class="iconbtn" data-act="openSub" data-id="history" data-p="buy"><i class="fas fa-receipt"></i></button></div>';
  if (st === 'none') { h += unavailable('none'); if (num(S.user.tokenBalance) > 0) h += holdingsCard(); $('tab-token').innerHTML = h; return; }
  h += marketCard() + holdingsCard();
  if (st === 'off') h += '<div class="note bad" style="margin:0 16px 14px"><i class="fas fa-screwdriver-wrench"></i><span>' + t('tk_off_msg') + '</span></div>';
  const ops = [['buy', 'fa-cart-plus'], ['sell', 'fa-hand-holding-dollar'], ['swap', 'fa-right-left'], ['transfer', 'fa-paper-plane']];
  const extra = '<button class="op" data-act="openSub" data-id="tokendetail"><i class="fas fa-chart-simple"></i><h4>' + L2('Token Details', 'টোকেন ডিটেইলস') + '</h4><p>' + L2('Chart, stats & history', 'চার্ট, তথ্য ও ইতিহাস') + '</p></button><button class="op ' + (twdState() === 'on' ? '' : 'off') + '" data-act="openSub" data-id="tokenwd"><i class="fas fa-arrow-up-from-bracket"></i><h4>' + L2('Withdraw', 'উত্তোলন') + '</h4><p>' + (twdState() === 'on' ? L2('Fee', 'ফি') + ' ' + num(twdCfg().feePct) + '%' : t('tk_unavail')) + '</p></button>';
  h += '<div class="sec"><span>' + t('tk_ops') + '</span></div><div class="pad grid2">' + ops.map(o => {
    const s = opState(o[0]);
    return '<button class="op ' + (s === 'on' ? '' : 'off') + '" data-act="openOp" data-id="' + o[0] + '"><i class="fas ' + o[1] + '"></i><h4>' + t('tk_' + o[0]) + '</h4><p>' + (s === 'on' ? '1 ' + esc(tsym()) + ' = ' + fmt(opRate(o[0]), 4) + ' ' + sym() : t('tk_unavail')) + '</p></button>';
  }).join('') + extra + '</div>';
  const fl = ['all', 'buy', 'sell', 'swap', 'transfer'];
  h += '<div class="sec"><span>' + t('tk_activity') + '</span><a data-act="openSub" data-id="history" data-p="buy" style="cursor:pointer">' + t('view_all') + '</a></div><div class="chips">' + fl.map(f => '<button class="chip ' + (TKF === f ? 'on' : '') + '" data-act="tkf" data-id="' + f + '">' + (f === 'all' ? t('all') : t('tk_' + f)) + '</button>').join('') + '</div>';
  const list = S.tokHist.map(nTok).filter(x => TKF === 'all' || x.cat === TKF).sort((a, b) => b.ts - a.ts).slice(0, 8);
  h += '<div class="card flat">' + (list.length ? list.map(txRow).join('') : emptyHtml('fa-inbox', t('no_tx'))) + '</div>';
  $('tab-token').innerHTML = h;
}
ACT.tkf = d => { TKF = d.id; renderToken(); };

/* ---------------- Quote engine ---------------- */
const OP = { type: 'buy', src: 'main', dst: 'token', amt: '', busy: false, review: null };
function initOp(type) {
  OP.type = type; OP.amt = ''; OP.review = null;
  const o = opCfg(type);
  if (type === 'buy') { OP.src = 'main'; OP.dst = 'token'; }
  else if (type === 'sell') { OP.src = 'token'; OP.dst = 'main'; }
  else if (type === 'transfer') { OP.src = 'token'; OP.dst = o.toMainEnabled !== false ? 'main' : 'task'; }
  else { OP.src = 'main'; OP.dst = 'token'; }
}
function opSides(type) {
  if (type === 'buy') return ['main', 'token'];
  if (type === 'sell') return ['token', 'main'];
  if (type === 'transfer') return ['token', OP.dst === 'task' ? 'task' : 'main'];
  return [OP.src, OP.dst];
}
function quote(type, src, dst, amtRaw) {
  const o = opCfg(type), rate = opRate(type);
  let pct = num(o.feePct !== undefined ? o.feePct : o.fee); pct = Math.max(0, Math.min(100, pct));
  const q = { type, src, dst, rate, feePct: pct, amt: 0, ok: false, err: '', empty: false };
  if (opState(type) !== 'on') { q.err = t('tk_unavail'); return q; }
  if (type === 'transfer') {
    if (dst === 'main' && o.toMainEnabled === false) { q.err = t('tk_dest_off'); return q; }
    if (dst === 'task' && o.toTaskEnabled === false) { q.err = t('tk_dest_off'); return q; }
  }
  if (type === 'swap' && (src === dst || (src === 'token') === (dst === 'token'))) { q.err = t('tk_swap_pair'); return q; }
  const a = Number(amtRaw);
  if (!(a > 0)) { q.empty = true; return q; }
  const dpS = DP(src), dpD = DP(dst);
  if (Math.abs(rnd(a, dpS) - a) > 1e-9) { q.err = t('err_dec', dpS); return q; }
  q.amt = rnd(a, dpS);
  const mn = num(o.min), mx = num(o.max);
  if (mn > 0 && q.amt < mn) { q.err = t('err_min', fmt(mn, dpS) + ' ' + unitTxt(src)); return q; }
  if (mx > 0 && q.amt > mx) { q.err = t('err_max', fmt(mx, dpS) + ' ' + unitTxt(src)); return q; }
  if (q.amt > num(S.user[FIELD[src]]) + 1e-9) { q.err = t('err_bal'); return q; }
  const gross = src === 'token' ? q.amt * rate : q.amt / rate;
  const out = flr(gross * (1 - pct / 100), dpD), fee = rnd(gross - out, dpD + 2);
  if (!(out > 0)) { q.err = t('err_small'); return q; }
  q.gross = rnd(gross, 8); q.out = out; q.fee = fee;
  q.tokenQty = src === 'token' ? q.amt : rnd(gross, 4);
  q.cashValue = src === 'token' ? rnd(gross, 4) : q.amt;
  q.ok = true; return q;
}
function qLines(q) {
  const dpS = DP(q.src), dpD = DP(q.dst);
  return kv(q.type === 'buy' ? t('total_payable') : t('you_send'), fmt(q.amt, dpS) + ' ' + unitTxt(q.src)) +
    kv(t('rate'), '1 ' + esc(tsym()) + ' = ' + fmt(q.rate, 6) + ' ' + sym()) +
    kv(t('fee') + ' (' + q.feePct + '%)', '- ' + fmt(q.fee, dpD) + ' ' + unitTxt(q.dst), 'neg') +
    kv(q.type === 'buy' ? t('est_tokens') : t('est_receive'), fmt(q.out, dpD) + ' ' + unitTxt(q.dst), 'pos');
}

/* ---------------- Operation page ---------------- */
SUBS.tokenop = {
  title: p => t('tk_' + p.p),
  render: p => renderOp(p.p),
  after: () => { applyI18n(); opUpdate(); },
  onData: () => opBalRefresh()
};
ACT.openOp = d => { initOp(d.id); openSub('tokenop', { p: d.id }); };
function renderOp(type) {
  const st = opState(type);
  if (st !== 'on') return unavailable(st);
  const o = opCfg(type), s = opSides(type), src = s[0], dst = s[1], dpS = DP(src);
  let pct = num(o.feePct !== undefined ? o.feePct : o.fee);
  let h = '<div class="card hero" style="margin-top:4px">' + kv(t('rate'), '1 ' + esc(tsym()) + ' = ' + fmt(o.rate, 6) + ' ' + sym()) + kv(t('fee'), pct + '%') +
    kv(t('min_amt'), num(o.min) > 0 ? fmt(o.min, dpS) + ' ' + unitTxt(src) : '—') + kv(t('max_amt'), num(o.max) > 0 ? fmt(o.max, dpS) + ' ' + unitTxt(src) : '—') + '</div><div class="card">';
  if (type === 'transfer') {
    h += '<div class="field"><label>' + t('destination') + '</label></div><div class="seg c2">' +
      '<button class="' + (dst === 'main' ? 'on' : '') + (o.toMainEnabled === false ? ' dis' : '') + '" data-act="opDest" data-id="main"><i class="fas fa-wallet"></i> ' + t('main_bal') + '</button>' +
      '<button class="' + (dst === 'task' ? 'on' : '') + (o.toTaskEnabled === false ? ' dis' : '') + '" data-act="opDest" data-id="task"><i class="fas fa-layer-group"></i> ' + t('task_bal') + '</button></div>';
  }
  if (type === 'swap') {
    const opts = sel => ['main', 'task', 'token'].map(a => '<option value="' + a + '"' + (sel === a ? ' selected' : '') + '>' + t('as_' + a) + '</option>').join('');
    h += '<div class="grid2" style="align-items:end"><div class="field"><label>' + t('swap_from') + '</label><select class="inp" id="opSrc" data-ch="opPair">' + opts(src) + '</select></div><div class="field"><label>' + t('swap_to') + '</label><select class="inp" id="opDst" data-ch="opPair">' + opts(dst) + '</select></div></div>' +
      '<div style="text-align:center;margin:-4px 0 10px"><button class="btn sm ghost inline" data-act="opFlip"><i class="fas fa-arrows-up-down"></i></button></div>';

/* ---------------- Execution (idempotent, debit → credit, rollback on failure) ---------------- */
async function execToken(q0) {
  if (!q0 || OP.busy) return;
  OP.busy = true; closeSheet(); busy(true, t('processing'), 15);
  let rec = null;
  try {
    const snap = await db.ref('config/token').once('value');   /* always use the freshest admin rate */
    S.cfg.token = snap.val();
    const q = quote(q0.type, q0.src, q0.dst, q0.amt);
    if (!q.ok) { busy(false); toast(q.err || t('tk_unavail')); renderAll(); return; }
    const slip = num(((TKC() || {}).market || {}).slippagePct) || 1;
    if (q.feePct !== q0.feePct || Math.abs(q.rate - q0.rate) / Math.max(q0.rate, 1e-12) * 100 > slip) { busy(false); toast(t('rate_changed')); renderSub(false); return; }
    const txId = 'TKN' + Date.now() + rid();
    rec = { txId, userId: uid, userName: tgUser.first_name || 'User', type: q.type, source: q.src, destination: q.dst, amountIn: q.amt, amountOut: q.out, fee: q.fee, feeUnit: q.dst, feePct: q.feePct, rate: q.rate, tokenQuantity: q.tokenQty, cashValue: q.cashValue, tokenSymbol: tsym(), marketPrice: tprice() || null, status: 'processing', timestamp: Date.now() };
    busy(true, t('processing'), 35);
    const cr = await db.ref('tokenTransactions/' + txId).transaction(c => c ? undefined : rec);   /* idempotency guard */
    if (!cr.committed) { busy(false); toast(t('dup_tx')); return; }
    busy(true, t('processing'), 60);
    const debited = await adjUser(FIELD[q.src], -q.amt);
    if (!debited) { await finalizeTok(rec, 'failed', t('err_bal')); showTokResult(rec); return; }
    busy(true, t('processing'), 80);
    const credited = await adjUser(FIELD[q.dst], q.out);
    if (!credited) { await adjUser(FIELD[q.src], q.amt); await finalizeTok(rec, 'failed', t('err_credit')); showTokResult(rec); return; }
    await finalizeTok(rec, 'completed', '');
    OP.amt = ''; showTokResult(rec);
  } catch (e) {
    console.error(e);
    if (rec && rec.status === 'processing') { try { await finalizeTok(rec, 'failed', 'error'); } catch (e2) {} }
    toast(t('fail_generic'));
  } finally { OP.busy = false; busy(false); }
}
async function finalizeTok(rec, status, reason) {
  rec.status = status; rec.completedAt = Date.now(); if (reason) rec.failReason = reason;
  const upd = { status, completedAt: rec.completedAt }; if (reason) upd.failReason = reason;
  try { await db.ref('tokenTransactions/' + rec.txId).update(upd); } catch (e) {}
  try { await db.ref('tokenHistory/' + uid + '/' + rec.txId).set(rec); } catch (e) {}
  try { const r = await db.ref('tokenTransactions/' + rec.txId + '/statsApplied').transaction(c => c ? undefined : true); if (r.committed) await applyStats(rec); } catch (e) {}
  const un = a => a === 'token' ? rec.tokenSymbol : sym();
  if (status === 'completed') notify('token', t('tk_notif_ok', t('tk_' + rec.type)), fmt(rec.amountIn, DP(rec.source)) + ' ' + un(rec.source) + ' → ' + fmt(rec.amountOut, DP(rec.destination)) + ' ' + un(rec.destination) + '\n' + t('tx_id') + ': ' + rec.txId, 'tok_' + rec.txId);
  else notify('token', t('tk_notif_fail', t('tk_' + rec.type)), (rec.failReason || '') + '\n' + t('tx_id') + ': ' + rec.txId, 'tok_' + rec.txId);
}
/* Analytics counters for the Admin panel: total tx, unique users, quantity, value, success/failed. */
async function applyStats(rec) {
  const base = 'tokenStats/' + rec.type, ok = rec.status === 'completed';
  await db.ref(base).transaction(s => {
    s = s || {};
    s.count = (s.count || 0) + 1;
    if (ok) {
      s.completedCount = (s.completedCount || 0) + 1;
      s.totalTokens = rnd((s.totalTokens || 0) + num(rec.tokenQuantity), 6);
      s.totalValue = rnd((s.totalValue || 0) + num(rec.cashValue), 4);
      s.totalFees = rnd((s.totalFees || 0) + num(rec.fee), 6);
      if (rec.type === 'transfer') { if (rec.destination === 'main') s.toMainTokens = rnd((s.toMainTokens || 0) + num(rec.tokenQuantity), 6); else s.toTaskTokens = rnd((s.toTaskTokens || 0) + num(rec.tokenQuantity), 6); }
    } else s.failedCount = (s.failedCount || 0) + 1;
    s.updatedAt = Date.now(); return s;
  });
  if (ok) {
    const r = await db.ref('tokenUsers/' + rec.type + '/' + rec.userId).transaction(c => c ? undefined : { firstAt: Date.now() });
    if (r.committed) await db.ref(base + '/uniqueUsers').transaction(n => (n || 0) + 1);
  }
}
function showTokResult(rec) {
  const ok = rec.status === 'completed', un = a => a === 'token' ? esc(rec.tokenSymbol) : sym();
  openSheet('<div class="res"><div class="big ' + (ok ? 'ok' : 'bad') + '"><i class="fas fa-' + (ok ? 'check' : 'xmark') + '"></i></div><h3>' + (ok ? t('tk_success') : t('tk_failed')) + '</h3></div><div class="qbox">' +
