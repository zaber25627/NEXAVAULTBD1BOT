    deducted = true; busy(true, t('wd_processing'), 55);
    const wdId = 'WD' + Date.now();
    const d = { wdId, userId: uid, userName: S.user.name || tgUser.first_name || 'User', method, account, amount, chargePct: pct, chargeAmount: charge, finalAmount, status: 'pending', timestamp: Date.now() };
    await db.ref('withdrawals/' + wdId).set(d);
    await db.ref('users/' + uid + '/withdrawHistory/' + wdId).set(d);
    await adjUser('totalWithdrawn', amount);
    busy(true, t('done'), 100); await sleep(500); busy(false);
    $('wd-account').value = ''; $('wd-amount').value = ''; wdFeePreview();
    const s = sym();
    openSheet('<div class="res"><div class="big ok"><i class="fas fa-check"></i></div><h3>' + t('wd_submitted') + '</h3></div><div class="qbox">' + kv(t('request_id'), esc(wdId)) + kv(t('requested'), fmt(amount) + ' ' + s) + kv(t('you_receive'), fmt(finalAmount) + ' ' + s, 'pos') + kv(t('status'), stLabel('pending')) + '</div><div class="btns"><button class="btn ghost" data-act="closeSheet">' + t('close') + '</button><button class="btn" data-act="openSub" data-id="txdetail" data-p="wd_' + wdId + '">' + t('track') + '</button></div>');
    NT.send(uid, 'wd_submitted', 'wdreq_' + wdId, { id: wdId, amount, pct, fee: charge, net: finalAmount, method, account });
    notifyAdmin('🔔 <b>New withdrawal request</b>\n👤 ' + esc(S.user.name || tgUser.first_name) + '\n🆔 <code>' + uid + '</code>\n💳 ' + esc(method) + '\n🏦 <code>' + esc(account) + '</code>\n💰 ' + amount + ' ' + s + '\n➖ ' + pct + '% = ' + charge + ' ' + s + '\n🎯 ' + finalAmount + ' ' + s);
  } catch (e) {
    console.error(e); busy(false);
    if (deducted) await adjUser('balance', amount);                    /* roll back the deduction if records could not be written */
    toast(t('wd_fail'));
  } finally { _wdBusy = false; busy(false); }
};

/* ---------- Live watchers: deposit / withdrawal status changes ---------- */
const W = { dep: {}, wd: {} };
function syncWatchers() {
  const u = S.user; try { twdWatch(); } catch (e) {}
  const sync = (store, hist, root, handler) => {
    Object.entries(hist || {}).forEach(([k, i]) => {
      if (!i) return;
      const id = i.depId || i.wdId || k, pend = ['pending', 'processing'].includes(i.status || 'pending');
      if (pend && !store[id]) {
        const ref = db.ref(root + '/' + id);
        const cb = ref.on('value', s => { if (s.exists()) handler(id, s.val()); });
        store[id] = { ref, cb };
      } else if (!pend && store[id]) { store[id].ref.off('value', store[id].cb); delete store[id]; }
    });
  };
  sync(W.dep, u.depositHistory, 'depositRequests', (id, gd) => {
    if (!gd.status || gd.status === 'pending') return;
    const upd = { status: gd.status }; if (gd.adminNote) upd.adminNote = gd.adminNote;
    db.ref('users/' + uid + '/depositHistory/' + id).update(upd); db.ref('deposits/' + id).update(upd);
    const ok = gd.status === 'approved';
    toast(ok ? t('dep_ok_toast') : t('dep_bad_toast'));
    if (gd.status === 'approved' || gd.status === 'rejected') NT.send(uid, ok ? 'dep_approved' : 'dep_rejected', 'dep_' + id + '_' + gd.status, { id, amount: gd.amount, method: gd.method, txn: gd.txId || gd.transactionId, reason: gd.adminNote });
  });
  sync(W.wd, u.withdrawHistory, 'withdrawals', (id, gd) => {
    if (!gd.status || gd.status === 'pending') return;
    const cur = (u.withdrawHistory[id] || {}).status; if (cur !== gd.status) db.ref('users/' + uid + '/withdrawHistory/' + id).update({ status: gd.status });
    if (gd.status === 'processing') { NT.send(uid, 'wd_processing', 'wd_' + id + '_processing', { id, amount: gd.amount, net: gd.finalAmount, method: gd.method }); return; }
    if (gd.status === 'approved' || gd.status === 'rejected') showWdStatus(gd.status, gd, id);
  });
}
function showWdStatus(status, d, id) {
  const ok = status === 'approved', s = sym(), amt = d.finalAmount !== undefined ? d.finalAmount : d.amount;
  openSheet('<div class="res"><div class="big ' + (ok ? 'ok' : 'bad') + '"><i class="fas fa-' + (ok ? 'check' : 'xmark') + '"></i></div><h3>' + (ok ? t('wd_ok_title') : t('wd_bad_title')) + '</h3></div><div class="qbox">' + kv(t('method'), esc(d.method || '—')) + kv(t('amount'), esc(amt) + ' ' + s) + kv(t('status'), stLabel(status)) + '</div><div class="note ' + (ok ? '' : 'bad') + '"><span>' + (ok ? t('wd_ok_msg') : t('wd_bad_msg')) + '</span></div><button class="btn ghost" data-act="closeSheet">' + t('got_it') + '</button>');
  NT.send(uid, ok ? 'wd_approved' : 'wd_rejected', 'wd_' + id + '_' + status, { id, amount: d.amount, net: d.finalAmount, method: d.method, account: d.account, reason: d.adminNote || d.reason, payRef: d.payRef || d.paymentRef });
}
</script>

<script>
/* =====================================================================
   EARNING — daily bonus, ads, tasks, referral, promo, vault, leaderboard
   (all existing earning modules preserved; every credit is an atomic transaction)
===================================================================== */
let _adBusy = false;
ACT.showBonus = () => {
  if (S.user.dailyBonusDate === todayStr()) return toast(t('bonus_already'));
  const cfg = S.cfg, amt = num(cfg.dailyBonusAmount || 20), n = num(cfg.bonusAdCount || 2);

    '<div class="bal-amt" style="text-align:center;margin:6px 0 16px">' + amt + ' <small>' + sym() + '</small></div><div class="btns"><button class="btn ghost" id="bonusCancel" data-act="closeSheet">' + t('later') + '</button><button class="btn gold" id="bonusBtn" data-act="claimBonus"><i class="fas fa-play"></i> ' + t('watch_claim') + '</button></div>');
};
ACT.claimBonus = async () => {
  const today = todayStr();
  if (S.user.dailyBonusDate === today) { closeSheet(); return toast(t('bonus_already')); }

  try {
    for (let i = 1; i <= n; i++) { sub.innerText = t('ad_watching', i, n); await showOneAd(i - 1); }
    const r = await db.ref('users/' + uid + '/dailyBonusDate').transaction(c => c === today ? undefined : today);   /* one claim per day */
    if (!r.committed) { closeSheet(); return toast(t('bonus_already')); }
    const ok = await earn(amt, 'bonus', 'daily_' + today);
    if (!ok) { await db.ref('users/' + uid + '/dailyBonusDate').set(''); throw new Error('credit'); }
    closeSheet(); toast(t('bonus_ok', amt));
    notify('earning', t('bonus_notif'), '+' + amt + ' ' + sym());
  } catch (e) {
    const m = e && e.message;
    toast(m === 'Ad Closed or Cancelled' ? t('bonus_cancel') : t('ad_error'));
    if ($('bonusSub')) { $('bonusSub').innerText = t('bonus_retry'); btn.disabled = false; cancel.disabled = false; btn.innerHTML = '<i class="fas fa-play"></i> ' + t('watch_claim'); }
  }
};

/* ---------- Ads ---------- */
function renderAds() {
  const el = $('ad-area'); if (!el) return;
  const cfg = S.cfg, slots = cfg.adSlots || [], limit = num(cfg.dailyAdLimit || 10), reward = num(cfg.adReward || 0.5), today = todayStr();
  const netMap = { adsgram: 'Adsgram', monetag: 'Monetag', gigapub: 'GigaPub', tads: 'TADS' };
  const icons = ['fa-film', 'fa-photo-film', 'fa-circle-play', 'fa-rectangle-ad'], cls = ['', 'pos', 'gold', 'info'];
  let h = '', n = 0;
  slots.forEach((slot, i) => {
    if (!slot || !slot.id || slot.network === 'none' || slot.network === '') return;
    n++;
    const w = num(S.user.dailyAds && S.user.dailyAds[today] && S.user.dailyAds[today]['slot_' + i]);
    h += '<div class="ad-card ' + (w >= limit ? 'done' : '') + '" data-act="watchAd" data-i="' + i + '"><div class="ico ' + cls[i % 4] + '"><i class="fas ' + icons[i % 4] + '"></i></div><h4>' + t('ad') + ' ' + (i + 1) + '</h4><p>' + esc(netMap[String(slot.network || '').toLowerCase()] || slot.network) + '</p><p>' + w + '/' + limit + ' ' + t('watched') + '</p><div class="ad-rw">+' + reward + ' ' + sym() + '</div></div>';
  });
  el.innerHTML = n ? h : '<div style="grid-column:1/-1">' + emptyHtml('fa-rectangle-ad', t('no_ads')) + '</div>';
}
ACT.watchAd = async d => {
  const i = Number(d.i), cfg = S.cfg, slot = (cfg.adSlots || [])[i], today = todayStr(), limit = num(cfg.dailyAdLimit || 10);
  const w = num(S.user.dailyAds && S.user.dailyAds[today] && S.user.dailyAds[today]['slot_' + i]);
  if (w >= limit) return toast(t('ad_limit'));
  if (!slot || !slot.id || slot.network === 'none' || slot.network === '') return toast(t('ad_inactive'));
  if (_adBusy) return; _adBusy = true;
  try {
    await showOneAd(i);
    const r = await db.ref('users/' + uid + '/dailyAds/' + today + '/slot_' + i).transaction(c => { const n = num(c); if (n >= limit) return; return n + 1; });
    if (!r.committed) return toast(t('ad_limit'));
    const reward = num(cfg.adReward || 0.5);
    if (await earn(reward, 'ad', 'slot_' + i + '_' + today)) toast('+' + reward + ' ' + sym());
  } catch (e) { toast(t('ad_incomplete')); }
  finally { _adBusy = false; }
};

/* ---------- Admin tasks (webTasks) ---------- */
function taskLive(x) { return !!x && x.visible !== false && !x.archived && !(num(x.expiresAt) && num(x.expiresAt) < Date.now()) && x.status !== 'disabled'; }
const _tb = {};
function renderAdminTasks() {
  const el = $('admin-task-area'); if (!el) return;
  const tasks = S.cfg.webTasks || {}, keys = Object.keys(tasks).filter(k => taskLive(tasks[k]));
  if (!keys.length) { el.innerHTML = emptyHtml('fa-list-check', t('no_admin_tasks')); return; }
  el.innerHTML = keys.map(k => {
    const x = tasks[k], done = !!(S.user.taskHistory && S.user.taskHistory[k]);
    return '<div class="task-item ' + (done ? 'done' : '') + '" ' + (done ? '' : 'data-act="doAdminTask" data-id="' + esc(k) + '"') + '><img class="task-ic" src="' + esc(x.icon || AVATAR) + '" onerror="this.src=AVATAR"><div class="rm"><div class="rt1">' + esc(x.name || 'Task') + '</div><div class="rt2" style="color:var(--pos);font-weight:800">+' + num(x.reward) + ' ' + sym() + '</div></div><div class="task-go">' + (done ? '✅ ' + t('done') : t('do_task')) + '</div></div>';
  }).join('');
}
ACT.doAdminTask = async d => {
  const k = d.id, x = (S.cfg.webTasks || {})[k]; if (!x || _tb[k]) return;
  if (S.user.taskHistory && S.user.taskHistory[k]) return;
  if (!taskLive(x)) return toast(t('feat_off'));
  if (num(x.minReferrals) > num(S.user.referrals)) return toast(t('task_locked_refs', num(x.minReferrals)));
  if (num(x.completionLimit) > 0 && num(x.completedCount) >= num(x.completionLimit)) return toast(t('task_full'));
  _tb[k] = true;
  try {
    openLink(x.url); await sleep(3500);
    const r = await db.ref('users/' + uid + '/taskHistory/' + k).transaction(c => c ? undefined : Date.now());
    if (!r.committed) return;
    if (num(x.completionLimit) > 0) { const cc = await db.ref('config/webTasks/' + k + '/completedCount').transaction(c => num(c) >= num(x.completionLimit) ? undefined : num(c) + 1); if (!cc.committed) { await db.ref('users/' + uid + '/taskHistory/' + k).remove(); return toast(t('task_full')); } }
    if (await earn(num(x.reward), 'task', k)) { toast('+' + num(x.reward) + ' ' + sym() + ' ' + t('task_done')); NT.send(uid, 'task_done', 'taskdone_' + k, { id: k, title: x.title || x.name || '', type: 'Web' }); NT.send(uid, 'task_reward', 'taskrw_' + k, { id: k, title: x.title || x.name || '', reward: num(x.reward) }); }
    else { await db.ref('users/' + uid + '/taskHistory/' + k).remove(); if (num(x.completionLimit) > 0) db.ref('config/webTasks/' + k + '/completedCount').transaction(c => Math.max(0, num(c) - 1)); }
  } finally { delete _tb[k]; }
};

/* ---------- User-created active tasks ---------- */
function ensureActiveTasksListener() {
  if (S._atL) return; S._atL = true;
  db.ref('activeTasks').orderByChild('status').equalTo('active').on('value', snap => {
    const arr = []; snap.forEach(c => { const v = c.val(); if (v) arr.push(v); });
    S.activeTasks = arr; if (S.tab === 'earn') renderActiveTasks();
  }, () => { S.activeTasks = []; if (S.tab === 'earn') renderActiveTasks(); });
}
function renderActiveTasks() {
  const el = $('active-tasks-area'); if (!el) return;
  if (S.activeTasks === null) { el.innerHTML = emptyHtml('fa-circle-notch fa-spin', t('loading')); return; }
  const list = S.activeTasks.filter(x => x.status === 'active');
  if (!list.length) { el.innerHTML = emptyHtml('fa-bolt', t('no_active_tasks')); return; }
  const icons = { 'Join Channel': 'fa-telegram', 'Visit Link': 'fa-arrow-up-right-from-square', 'Subscribe': 'fa-bell', 'Follow': 'fa-user-plus', 'Like': 'fa-heart', 'Comment': 'fa-comment' };
  el.innerHTML = list.map(x => {
    const done = num(x.participantsCompleted), lim = num(x.participantLimit), full = done >= lim;
    const mine = String(x.creatorId) === uid, had = !!(x.participants && x.participants[uid]);
    let b;
    if (mine) b = '<div class="kv" style="margin-top:6px"><span><i class="fas fa-crown" style="color:var(--gold)"></i> ' + t('your_task') + '</span><b>' + done + '/' + lim + '</b></div>';
    else if (had) b = '<button class="btn" disabled style="background:var(--pos-soft);color:var(--pos);box-shadow:none"><i class="fas fa-check"></i> ' + t('completed') + '</button>';
    else if (full) b = '<button class="btn ghost" disabled><i class="fas fa-lock"></i> ' + t('slots_full') + '</button>';
    else b = '<button class="btn" data-act="doActiveTask" data-id="' + esc(x.taskId) + '"><i class="fas fa-play"></i> ' + t('do_task') + ' (+' + num(x.reward) + ' ' + sym() + ')</button>';
    return '<div class="atask"><div class="row" style="padding:0;border:none;cursor:default"><div class="ico"><i class="fas ' + (icons[x.type] || 'fa-list-check') + '"></i></div><div class="rm"><div class="rt1">' + esc(x.type || 'Task') + '</div><div class="lnk">' + esc(x.link || '—') + '</div></div>' + pill(full ? 'closed' : 'open') + '</div>' +
      '<div class="stats"><div>' + t('reward') + '<b>' + num(x.reward) + ' ' + sym() + '</b></div><div>' + t('progress') + '<b>' + done + '/' + lim + '</b></div><div>' + t('by') + '<b>' + esc(String(x.creatorName || 'User').substring(0, 10)) + '</b></div></div>' + b + '</div>';
  }).join('');
}
INP.taskCost = () => {
  const r = num($('ct-reward').value), l = num($('ct-limit').value), box = $('taskCost');
  if (!r || !l) { box.hidden = true; return; }
  box.hidden = false;
  box.innerHTML = kv(t('task_reward'), r + ' ' + sym()) + kv(t('task_limit'), l) + kv(t('total_cost'), '<span class="neg">' + fmt(r * l) + ' ' + sym() + '</span>') + kv(t('task_bal'), fmt(S.user.taskBalance) + ' ' + sym());
};
ACT.createTask = async () => {
  const link = $('ct-link').value.trim(), type = $('ct-type').value, reward = Number($('ct-reward').value), limit = Number($('ct-limit').value);
  const ts = S.cfg.taskSettings || S.cfg.taskBalanceSettings || {}, minR = num(ts.minReward || 1), maxP = num(ts.maxParticipants || 1000), tbal = num(S.user.taskBalance);
  if (!link || !safeUrl(link)) return toast(t('task_need_link'));
  if (!type) return toast(t('task_need_type'));
  if (!reward || reward < minR) return toast(t('min') + ' ' + t('task_reward') + ': ' + minR + ' ' + sym());
  if (!limit || limit < 1 || Math.floor(limit) !== limit) return toast(t('task_need_limit'));
  if (limit > maxP) return toast(t('max') + ' ' + t('task_limit') + ': ' + maxP);
  const total = +(reward * limit).toFixed(2);
  if (total > tbal) return toast(t('task_bal_low', total, sym(), tbal.toFixed(2)));
  const btn = $('createTaskBtn'); btn.disabled = true;
  let paid = false;
  try {
    paid = await adjUser('taskBalance', -total);
    if (!paid) { toast(t('err_bal')); btn.disabled = false; return; }
    const id = 'TASK' + Date.now() + '_' + uid;
    const d = { taskId: id, creatorId: uid, creatorName: tgUser.first_name || 'User', link, type, title: type + ': ' + link.substring(0, 40), name: type, url: link, reward, participantLimit: limit, maxParticipants: limit, participantsCompleted: 0, participants: {}, totalCost: total, status: 'active', createdAt: Date.now(), timestamp: Date.now() };
    await db.ref('activeTasks/' + id).set(d);
    await db.ref('userTasks/' + id).set(d);
    await db.ref('users/' + uid + '/createdTasks/' + id).set({ taskId: id, timestamp: Date.now() });
    await logLedger({ cat: 'other', source: 'task_created', amount: -total, unit: 'task', ref: id });
    ['ct-link', 'ct-reward', 'ct-limit'].forEach(x => { $(x).value = ''; }); $('ct-type').value = ''; $('taskCost').hidden = true;
    toast(t('task_created'));
    notify('earning', t('task_created'), t('task_type') + ': ' + type + '\n' + t('task_reward') + ': ' + reward + ' ' + sym() + '\n' + t('task_limit') + ': ' + limit + '\n' + t('total_cost') + ': ' + total + ' ' + sym());
  } catch (e) { console.error(e); if (paid) await adjUser('taskBalance', total); toast(t('fail_generic')); }
  finally { btn.disabled = false; }
};
ACT.doActiveTask = async d => {
  const id = d.id; if (_tb[id]) return;
  const snap = await db.ref('activeTasks/' + id).once('value'); if (!snap.exists()) return toast(t('not_found'));
  const x = snap.val();
  if (x.status !== 'active') return toast(t('task_inactive'));
  if (String(x.creatorId) === uid) return toast(t('task_own'));
  if (x.participants && x.participants[uid]) return toast(t('task_already'));
  if (num(x.participantsCompleted) >= num(x.participantLimit)) return toast(t('slots_full'));
  _tb[id] = true;
  try {
    openLink(x.link); await sleep(4000);
    const r = await db.ref('activeTasks/' + id).transaction(c => {     /* atomic slot reservation */
      if (!c) return c;
      if (c.status !== 'active' || String(c.creatorId) === uid) return;
      const done = num(c.participantsCompleted), lim = num(c.participantLimit);
      if (done >= lim || (c.participants && c.participants[uid])) return;
      c.participants = c.participants || {}; c.participants[uid] = { timestamp: Date.now(), name: tgUser.first_name || 'User' };
      c.participantsCompleted = done + 1; if (done + 1 >= lim) c.status = 'completed';
      return c;
    });
    if (!r.committed || !r.snapshot.exists()) return toast(t('slots_full'));
    const nv = r.snapshot.val();
    await db.ref('userTasks/' + id).update({ participants: num(nv.participantsCompleted), ...(nv.status === 'completed' ? { status: 'completed' } : {}) });
    const reward = num(x.reward);
    if (await earn(reward, 'active_task', id)) {
      await db.ref('users/' + uid + '/activeTaskHistory/' + id).set({ reward, timestamp: Date.now() });
      toast('+' + reward + ' ' + sym() + ' ' + t('task_done')); NT.send(uid, 'task_done', 'taskdone_a' + id, { id, title: x.title || x.name || x.type || '', type: x.type || '' }); NT.send(uid, 'task_reward', 'taskrw_a' + id, { id, title: x.title || x.name || x.type || '', reward });
    }
  } finally { delete _tb[id]; }
};

/* ---------- Referral ---------- */
function getRefLink() { return 'https://t.me/' + (S.cfg.botUsername || 'bot') + '/app?startapp=' + uid; }
ACT.copyLink = () => copyText(getRefLink());
ACT.shareLink = () => { const url = 'https://t.me/share/url?url=' + encodeURIComponent(getRefLink()) + '&text=Join%20Now!'; if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, '_blank'); };
ACT.openTutorial = () => { if (S.cfg.tutorialLink) openLink(S.cfg.tutorialLink); else toast(t('no_tutorial')); };
function renderRefTasks() {
  const el = $('ref-tasks-area'); if (!el) return;
  const rt = S.cfg.refTasks;
  if (!rt || !Object.keys(rt).length) { el.innerHTML = ''; return; }
  const refs = num(S.user.referrals), claimed = S.user.claimedRefTasks || {};
  el.innerHTML = '<div class="sec"><span>' + t('ref_targets') + '</span></div><div class="pad">' + Object.keys(rt).map(k => {
    const x = rt[k], isC = !!claimed[k], can = refs >= num(x.requiredRefs) && !isC;
    return '<div class="atask"><div class="row" style="padding:0;border:none;cursor:default"><div class="ico warn"><i class="fas fa-trophy"></i></div><div class="rm"><div class="rt1">' + esc(x.title) + '</div><div class="rt2">' + num(x.requiredRefs) + ' ' + t('refs_required') + ' · +' + num(x.reward) + ' ' + sym() + '</div></div>' +
      (isC ? '<span class="pill ok">' + t('st_claimed') + '</span>' : can ? '<button class="btn sm inline" data-act="claimRef" data-id="' + esc(k) + '">' + t('claim') + '</button>' : '<span class="pill pending"><i class="fas fa-lock"></i> ' + refs + '/' + num(x.requiredRefs) + '</span>') + '</div></div>';
  }).join('') + '</div>';
}
ACT.claimRef = async d => {
  const k = d.id, x = (S.cfg.refTasks || {})[k]; if (!x) return;
  if (num(S.user.referrals) < num(x.requiredRefs)) return toast(t('locked'));
  const r = await db.ref('users/' + uid + '/claimedRefTasks/' + k).transaction(c => c ? undefined : true);
  if (!r.committed) return toast(t('already_claimed'));
  if (await earn(num(x.reward), 'ref_target', k, 'reward')) { toast('🎉 +' + num(x.reward) + ' ' + sym()); NT.send(uid, 'ref_reward', 'refrw_t' + k, { id: k, title: x.title || t('ref_target_done'), reward: num(x.reward) }); }
  else await db.ref('users/' + uid + '/claimedRefTasks/' + k).remove();
};
ACT.claimVault = async d => {
  const k = d.id, v = (S.user.vaultRewards || {})[k]; if (!v) return;

    if (joined) return { k: 'lost', pill: '', ic: 'fa-circle-xmark', c: 'var(--neg)', bg: 'var(--neg-soft)', label: L2('Not won', 'জেতেননি'), sub: L2('You were not selected this time. Better luck next time!', 'এইবার আপনি নির্বাচিত হননি। পরের বার শুভকামনা!') };
    return { k: 'ended', pill: '', ic: 'fa-flag-checkered', c: 'var(--muted)', bg: 'rgba(255,255,255,.05)', label: L2('Ended', 'শেষ'), sub: '' };
  }
  return joined ? { k: 'wait', pill: 'warn', ic: 'fa-hourglass-half', c: 'var(--warn)', bg: 'var(--warn-soft)', label: L2('Waiting for result', 'ফলাফলের অপেক্ষায়'), sub: L2('The giveaway has ended. Winners will be announced soon.', 'গিভঅ্যাওয়ে শেষ হয়েছে। শীঘ্রই বিজয়ী ঘোষণা করা হবে।') } : { k: 'ended', pill: '', ic: 'fa-flag-checkered', c: 'var(--muted)', bg: 'rgba(255,255,255,.05)', label: L2('Ended', 'শেষ'), sub: '' };
}
const gwTotal = g => num(g.totalPrize) || num(g.reward) * num(g.winnerCount);
const gwBanner = m => '<div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:' + m.bg + ';border:1px solid ' + m.c + '"><i class="fas ' + m.ic + '" style="font-size:1.5rem;color:' + m.c + '"></i><div style="min-width:0"><b style="color:' + m.c + ';font-size:.95rem">' + m.label + '</b>' + (m.k === 'won' ? '<div class="num" style="font-size:1.25rem;font-weight:800;color:var(--pos)">+' + fmt(m.amt) + ' ' + sym() + (m.rank ? ' <span class="tiny" style="color:var(--muted)">· ' + L2('Rank', 'র‍্যাঙ্ক') + ' #' + m.rank + '</span>' : '') + '</div>' : '') + (m.sub ? '<div class="tiny" style="margin-top:2px">' + m.sub + '</div>' : '') + '</div></div>';
const gwTile = (l, v, c) => '<div style="background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:9px 10px;text-align:center"><div class="tiny" style="font-size:.62rem">' + l + '</div><b class="num" style="font-size:.9rem;' + (c ? 'color:' + c : '') + '">' + v + '</b></div>';
const gwDetails = (g, p) => { const st = gwState(g), cur = sym(); return '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0">' + gwTile(L2('Per winner', 'প্রতি বিজয়ী'), fmt(num(g.reward)) + ' ' + cur, 'var(--pos)') + gwTile(L2('Winners', 'বিজয়ী'), num(g.winnerCount)) + gwTile(L2('Total prize', 'মোট পুরস্কার'), fmt(gwTotal(g)) + ' ' + cur) + '</div>' +
  kv(L2('Participants', 'অংশগ্রহণকারী'), num(g.participantCount)) + (p && p.joinedAt ? kv(L2('You joined', 'আপনি অংশ নিয়েছেন'), fdt(p.joinedAt)) : '') +
  (st === 'active' && gwEndT(g) ? kv(L2('Time left', 'বাকি সময়'), '<span class="js-cd" data-t="' + gwEndT(g) + '">' + cdText(gwEndT(g) - nowMs()) + '</span>') : (gwEndT(g) ? kv(L2('Ended on', 'শেষ হয়েছে'), fdt(gwEndT(g))) : '')) +
  (st === 'completed' && g.completedAt ? kv(L2('Result announced', 'ফলাফল ঘোষণা'), fdt(g.completedAt)) : ''); };
SUBS.giveaway = {
  title: () => L2('Giveaways', 'গিভঅ্যাওয়ে'), live: true,
  render: () => {
    const l = gwList(), cur = sym(), mine = l.filter(g => S.gwPart[g.id]), won = mine.filter(g => gwMine(g).k === 'won');
    let h = '<div class="card hero" style="margin-top:4px"><div class="card-t"><i class="fas fa-gift"></i> ' + L2('Giveaways', 'গিভঅ্যাওয়ে') + '</div><div class="lbhero-s">' + L2('Join a giveaway for a chance to win rewards.', 'গিভঅ্যাওয়েতে অংশ নিয়ে পুরস্কার জেতার সুযোগ নিন।') + '</div>' +
      '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px 12px">' + gwTile(L2('Joined', 'অংশ নিয়েছি'), mine.length) + gwTile(L2('Won', 'জিতেছি'), won.length, 'var(--pos)') + gwTile(L2('Total won', 'মোট জয়'), fmt(won.reduce((s, g) => s + gwMine(g).amt, 0)) + ' ' + cur, 'var(--pos)') + '</div>' +
      '<div style="padding:0 16px 14px"><button class="btn ghost" data-act="gwMineOpen"><i class="fas fa-medal"></i> ' + L2('My results', 'আমার ফলাফল') + '</button></div></div>';
    if (!l.length) return h + '<div class="card">' + emptyHtml('fa-gift', L2('No giveaways right now. Check back soon!', 'এখন কোনো গিভঅ্যাওয়ে নেই। শীঘ্রই আবার দেখুন!')) + '</div>';
    return h + l.map(g => {
      const st = gwState(g), m = gwMine(g), mx = num(g.maxParticipants), j = num(g.participantCount), full = mx > 0 && j >= mx, needRef = num(g.minRefs), okReq = num(S.user.referrals) >= needRef;
      let btn;
      if (st === 'active') btn = m.k === 'running' ? '<button class="btn ghost" disabled><i class="fas fa-circle-check"></i> ' + L2('Joined — running', 'অংশ নেওয়া হয়েছে — চলমান') + '</button>' : '<button class="btn" data-act="gwJoin" data-id="' + esc(g.id) + '"' + (full || !okReq ? ' disabled' : '') + '><i class="fas fa-hand-point-up"></i> ' + (full ? L2('Slots full', 'স্লট পূর্ণ') : !okReq ? L2('Need ', 'প্রয়োজন ') + needRef + L2(' referrals', ' রেফারেল') : L2('Join now', 'অংশ নিন')) + '</button>';
      else if (st === 'completed') btn = '<button class="btn ghost" data-act="gwWinners" data-id="' + esc(g.id) + '"><i class="fas fa-trophy"></i> ' + L2('Winner results', 'বিজয়ীদের তালিকা') + '</button>';
      else btn = '<button class="btn ghost" disabled><i class="fas fa-hourglass-half"></i> ' + L2('Waiting for results', 'ফলাফলের অপেক্ষায়') + '</button>';
      return '<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b style="font-size:.95rem">' + esc(g.title || 'Giveaway') + '</b><span class="pill ' + m.pill + '">' + m.label + '</span></div>' +
        (g.description ? '<div class="tiny" style="margin:6px 0 0;white-space:pre-line">' + esc(g.description) + '</div>' : '') + gwDetails(g, S.gwPart[g.id]) +
        (needRef ? kv(L2('Min referrals', 'ন্যূনতম রেফারেল'), '<span class="' + (okReq ? 'pos' : 'neg') + '">' + num(S.user.referrals) + ' / ' + needRef + '</span>') : '') +
        (m.k === 'won' || m.k === 'lost' ? '<div style="margin-top:10px">' + gwBanner(m) + '</div>' : '') + '<div style="margin-top:12px">' + btn + '</div></div>';
    }).join('');
  }
};
let _gwBusy = false;
ACT.gwJoin = async d => {
  const g = S.giveaways[d.id]; if (!g || _gwBusy) return; if (!featOn('giveaway')) return toast(t('feat_off'));
  if (gwState(g) !== 'active') return toast(L2('This giveaway is closed', 'গিভঅ্যাওয়ে বন্ধ'));
  if (num(S.user.referrals) < num(g.minRefs)) return toast(L2('Requirements not met', 'শর্ত পূরণ হয়নি'));
  _gwBusy = true; busy(true, t('processing'), 40); const mx = num(g.maxParticipants); let counted = false;
  try {
    const r = await db.ref('giveaways/' + g.id + '/participantCount').transaction(c => (mx > 0 && num(c) >= mx) ? undefined : num(c) + 1);
    if (!r.committed) { busy(false); return toast(L2('Slots are full', 'স্লট পূর্ণ')); } counted = true;
    const pr = await db.ref('giveawayParticipants/' + g.id + '/' + uid).transaction(c => c ? undefined : { uid, name: tgUser.first_name || 'User', photo: tgUser.photo_url || '', joinedAt: Date.now() });
    if (!pr.committed) { await db.ref('giveaways/' + g.id + '/participantCount').transaction(c => Math.max(0, num(c) - 1)); busy(false); return toast(L2('Already joined', 'আগেই অংশ নিয়েছেন')); }
    NT.send(uid, 'gw_joined', 'gwj_' + g.id, { id: g.id, title: g.title || '', reward: g.reward });
    busy(false); toast(L2('You joined the giveaway', 'গিভঅ্যাওয়েতে অংশ নিয়েছেন'));
  } catch (err) { console.error(err); if (counted) { try { await db.ref('giveaways/' + g.id + '/participantCount').transaction(c => Math.max(0, num(c) - 1)); } catch (x) {} } busy(false); toast(t('fail_generic')); }
  finally { _gwBusy = false; busy(false); }
};
/* Winner results of one giveaway — summary, my result, full ranked list */
ACT.gwWinners = d => {
  const g = S.giveaways[d.id]; if (!g) return; const cur = sym(), m = gwMine(g), ws = Object.keys(g.winners || {}).map(u => Object.assign({ uid: u }, g.winners[u])).sort((a, b) => num(a.rank) - num(b.rank)), paid = ws.reduce((s, w) => s + (num(w.prize) || num(g.reward)), 0);
  openSheet('<h3><i class="fas fa-trophy" style="color:var(--accent)"></i>' + esc(g.title || 'Giveaway') + '</h3>' +
    '<div style="margin:4px 0 12px">' + (S.gwPart[g.id] ? gwBanner(m) : '<div class="tiny">' + L2('You did not take part in this giveaway.', 'আপনি এই গিভঅ্যাওয়েতে অংশ নেননি।') + '</div>') + '</div>' +
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px">' + gwTile(L2('Participants', 'অংশগ্রহণকারী'), num(g.participantCount)) + gwTile(L2('Winners', 'বিজয়ী'), ws.length || num(g.winnerCount)) + gwTile(L2('Total paid', 'মোট প্রদান'), fmt(paid || gwTotal(g)) + ' ' + cur, 'var(--pos)') + '</div>' +
    (g.completedAt ? kv(L2('Result announced', 'ফলাফল ঘোষণা'), fdt(g.completedAt)) : '') + kv(L2('Prize per winner', 'প্রতি বিজয়ীর পুরস্কার'), '<span class="pos">' + fmt(num(g.reward)) + ' ' + cur + '</span>') +
    '<div class="sec" style="margin-top:12px"><span>' + L2('Winner list', 'বিজয়ীদের তালিকা') + ' (' + ws.length + ')</span></div>' +
    (ws.length ? ws.map(w => { const me = String(w.uid) === String(uid); return '<div class="lbw' + (me ? ' me' : '') + '"><span class="lbw-r">' + (num(w.rank) <= 3 ? ['🥇', '🥈', '🥉'][num(w.rank) - 1] : '#' + num(w.rank)) + '</span><div class="rm" style="flex:1;min-width:0"><div class="rt1">' + esc((w.name || 'User').substring(0, 22)) + (me ? ' <span class="tiny pos">(' + L2('you', 'আপনি') + ')</span>' : '') + '</div></div><span class="lbw-a">+' + fmt(num(w.prize) || num(g.reward)) + ' <small>' + cur + '</small></span></div>'; }).join('') : emptyHtml('fa-info-circle', L2('Winner details coming soon', 'বিজয়ীর তথ্য শীঘ্রই আসবে'))) +
    '<button class="btn ghost" data-act="closeSheet" style="margin-top:12px">' + L2('Close', 'বন্ধ করুন') + '</button>');
};
/* My results — grouped by status with filters */
let GWF = 'all';
const GWFS = [['all', 'All', 'সব'], ['running', 'Running', 'চলমান'], ['wait', 'Waiting', 'অপেক্ষায়'], ['won', 'Won', 'জয়ী'], ['lost', 'Not won', 'জেতেননি']];
function gwMineHtml() {
  const cur = sym(), all = gwList().filter(g => S.gwPart[g.id]), pr = { running: 0, wait: 1, won: 2, lost: 3, ended: 4 }, cnt = f => f === 'all' ? all.length : all.filter(g => gwMine(g).k === f).length;
  const l = all.filter(g => GWF === 'all' || gwMine(g).k === GWF).sort((a, b) => (pr[gwMine(a).k] - pr[gwMine(b).k]) || (num(b.completedAt) || gwEndT(b)) - (num(a.completedAt) || gwEndT(a))), won = all.filter(g => gwMine(g).k === 'won');
  return '<h3><i class="fas fa-medal" style="color:var(--accent)"></i>' + L2('My giveaway results', 'আমার গিভঅ্যাওয়ে ফলাফল') + '</h3>' +
    '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 12px">' + gwTile(L2('Joined', 'অংশ'), all.length) + gwTile(L2('Running', 'চলমান'), cnt('running'), 'var(--info)') + gwTile(L2('Won', 'জয়'), won.length, 'var(--pos)') + gwTile(L2('Total won', 'মোট'), fmt(won.reduce((s, g) => s + gwMine(g).amt, 0)), 'var(--pos)') + '</div>' +
    '<div class="chips">' + GWFS.map(f => '<button class="chip ' + (GWF === f[0] ? 'on' : '') + '" data-act="gwMineF" data-id="' + f[0] + '">' + L2(f[1], f[2]) + '<span class="cnt">' + cnt(f[0]) + '</span></button>').join('') + '</div>' +
    (l.length ? l.map(g => { const m = gwMine(g), p = S.gwPart[g.id]; return '<div class="card" style="margin:0 0 12px"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px"><b>' + esc(g.title || 'Giveaway') + '</b><span class="pill ' + m.pill + '">' + m.label + '</span></div>' + gwBanner(m) + gwDetails(g, p) +
      (gwState(g) === 'completed' ? '<button class="btn ghost" data-act="gwWinners" data-id="' + esc(g.id) + '" style="margin-top:10px"><i class="fas fa-trophy"></i> ' + L2('Winner list', 'বিজয়ীদের তালিকা') + '</button>' : '') + '</div>'; }).join('') : emptyHtml('fa-gift', all.length ? L2('Nothing in this filter', 'এই ফিল্টারে কিছু নেই') : L2('You have not joined any giveaway yet', 'আপনি এখনো কোনো গিভঅ্যাওয়েতে অংশ নেননি'))) +
    '<button class="btn ghost" data-act="closeSheet" style="margin-top:6px">' + L2('Close', 'বন্ধ করুন') + '</button>';
}
ACT.gwMineOpen = () => { GWF = 'all'; openSheet(gwMineHtml()); };
ACT.gwMineF = d => { GWF = d.id; const s = $('sheet'), y = s.scrollTop; s.innerHTML = '<div class="grab"></div>' + gwMineHtml(); s.scrollTop = y; };
